<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuvra</title>
<meta name="theme-color" content="#07080D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg:#07080D; --side:#0A0B11; --surface:#0F1119; --surface2:#161926; --line:#232739; --text:#EEF0F6; --muted:#9AA3BC;
  --accent:#FF4B1F; --onaccent:#1A0500; --accenttext:#FF6B3D; --sun:#FF4B1F; --core:#FFF3E6; --glow:rgba(255,75,31,.20);
  --danger:#E5484D;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 'DM Sans', system-ui, sans-serif; overflow: hidden;
  background-image: radial-gradient(900px 420px at 62% -10%, var(--glow), transparent 70%); }
body, .tx { transition: background-color .6s ease, color .6s ease; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg .core { fill: var(--core); stroke: var(--sun); stroke-width: 3; transition: fill .6s, stroke .6s; }
.app { display: flex; height: 100%; height: 100dvh; }
/* sidebar (always on wide screens, a drawer on phones) */
.side { width: 288px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 20px 8px; font: 600 20px 'Sora', sans-serif; letter-spacing: -0.02em; }
.newchat { margin: 12px 14px 6px; background: var(--accent); color: var(--onaccent); border: 0; border-radius: 14px; min-height: 46px; font-weight: 600; }
.chats { flex: 1; overflow-y: auto; padding: 4px 14px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--muted); padding: 12px 6px 4px; }
.row { display: flex; align-items: center; border-radius: 12px; }
.row.cur { background: var(--surface2); }
.row button.open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 10px 12px; min-height: 44px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row button.del { background: transparent; border: 0; color: var(--muted); width: 40px; height: 44px; opacity: 0; }
.row:hover button.del, .row:focus-within button.del { opacity: 1; }
.links { border-top: 1px solid var(--line); padding: 8px 14px; }
.link { display: flex; width: 100%; justify-content: space-between; align-items: center; background: transparent; border: 0; border-radius: 12px; padding: 0 12px; min-height: 44px; text-align: left; font-weight: 500; }
.link:hover:not([disabled]) { background: var(--surface2); }
.link[disabled] { color: var(--muted); cursor: default; }
.link small { color: var(--muted); font-weight: 400; font-size: 13px; }
.account { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--accent); color: var(--onaccent); display: grid; place-items: center; font-weight: 700; }
.scrim { display: none; }
/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.top { height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--line); }
.top .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
.icon { background: transparent; border: 0; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
.icon:hover { background: var(--surface2); }
.hamburger { display: none; }
.banner { background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 8px 16px; text-align: center; }
.banner b { color: var(--accenttext); font-weight: 600; }
.scroll { flex: 1; overflow-y: auto; scroll-behavior: auto; padding: 24px 16px 8px; }
.thread { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; }
.msg { display: flex; flex-direction: column; gap: 6px; animation: rise .35s ease both; }
.msg.user { align-self: flex-end; max-width: 80%; }
.msg.user .bubble { background: var(--surface2); border-radius: 18px 18px 4px 18px; padding: 12px 16px; }
.msg.ai { align-self: flex-start; max-width: 94%; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 14px 18px; }
.bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; min-height: 36px; font-size: 14px; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.note { align-self: center; color: var(--muted); font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }
.cursor { display: inline-block; width: .55em; color: var(--accenttext); animation: blink 1s steps(2) infinite; }
.thinking { align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 6px 4px; animation: rise .3s ease both; }
.thinking svg { overflow: visible; animation: hop 1.1s ease-in-out infinite; }
.thinking .word { font-weight: 500; animation: rise .35s ease both; }
.thinking .dots span { animation: dot 1.2s infinite; display: inline-block; }
.thinking .dots span:nth-child(2) { animation-delay: .2s; }
.thinking .dots span:nth-child(3) { animation-delay: .4s; }
.err { align-self: stretch; background: var(--surface); border: 1px solid var(--danger); border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.err b { color: var(--danger); }
.empty { text-align: center; color: var(--muted); margin: auto; padding: 40px 0; }
.empty h1 { font: 600 32px 'Sora', sans-serif; color: var(--text); margin: 12px 0 6px; letter-spacing: -0.02em; }
.down { position: absolute; right: 24px; bottom: 170px; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; width: 44px; height: 44px; display: none; place-items: center; z-index: 5; }
.down.show { display: grid; }
/* composer */
.composer { flex-shrink: 0; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
.box { max-width: 760px; margin: 0 auto; position: relative; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 10px 10px 16px; display: flex; flex-direction: column; gap: 10px; }
.card textarea { width: 100%; background: transparent; border: 0; outline: none; resize: none; color: var(--text); font: inherit; max-height: 160px; padding: 0; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tools .left { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.pill { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; min-height: 44px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.pill.plain { background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; }
.send { background: var(--accent); color: var(--onaccent); border: 0; border-radius: 12px; width: 44px; height: 44px; font-size: 20px; font-weight: 700; flex-shrink: 0; }
.send[disabled] { opacity: .45; cursor: default; }
.send.stop { background: var(--surface2); color: var(--text); border: 1px solid var(--line); }
.menu { position: absolute; left: 0; bottom: 100%; margin-bottom: 10px; width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 20; animation: rise .2s ease both; }
.regen { align-self: stretch; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; animation: rise .2s ease both; }
.regen .head { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--muted); padding: 4px 6px; }
.menu .head { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--muted); padding: 4px 6px; }
.opt { text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-height: 44px; display: flex; align-items: center; gap: 12px; }
.opt.sel { border-color: var(--accent); }
.opt[disabled] { opacity: .5; cursor: default; }
.opt .grow { flex: 1; } .opt small { color: var(--muted); display: block; font-size: 14px; }
.usage { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 0; position: relative; }
.usage button { background: transparent; border: 0; color: var(--muted); font-size: 13px; padding: 0; }
.bar { width: 220px; max-width: 70%; height: 5px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s linear; }
.usage.low .bar > div { background: var(--danger); } .usage.low button { color: var(--danger); }
.pop { position: absolute; right: 8px; top: -8px; font-size: 13px; font-weight: 600; color: var(--accenttext); animation: floatup 1.3s ease-out both; pointer-events: none; }
/* dialogs */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; width: min(520px, 100%); max-height: 90dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { margin: 0; font: 600 22px 'Sora', sans-serif; }
.dialog input[type=text], .dialog input[type=password] { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--text); padding: 12px; font: inherit; width: 100%; min-height: 44px; }
.btn { background: var(--accent); color: var(--onaccent); border: 0; border-radius: 12px; min-height: 44px; padding: 0 18px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; } .kv span:first-child { color: var(--muted); }
.big { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; } .big > div { height: 100%; background: var(--accent); border-radius: 999px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; } .seg button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 40px; }
.seg button.on { border-color: var(--accent); color: var(--accenttext); }
.wash { position: fixed; left: 50%; top: 55%; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; border-radius: 50%; pointer-events: none; z-index: 40;
  background: radial-gradient(circle, var(--core) 0%, var(--accent) 30%, transparent 66%); animation: swell 1000ms ease-out both; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: none; } }
@keyframes floatup { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }
@keyframes hop { 0%, 100% { transform: none; } 20% { transform: scale(1.12, .88); } 45% { transform: translateY(-12px) rotate(-8deg) scale(.96, 1.06); } 70% { transform: rotate(6deg) scale(1.1, .9); } 85% { transform: translateY(-4px); } }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes swell { 0% { opacity: 0; transform: scale(.3); } 45% { opacity: .55; } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes slidein { 0% { transform: translateX(-30px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (max-width: 900px) {
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 312px; max-width: 86vw; display: none; }
  body.menu-open .side { display: flex; animation: slidein .28s ease both; }
  body.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); border: 0; z-index: 25; }
  .hamburger { display: grid; }
  .down { bottom: 190px; right: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Chats and settings">
    <div class="brand" id="brand"></div>
    <button class="newchat" id="newChat">+ New chat</button>
    <div class="chats" id="chatList"></div>
    <div class="links" id="links"></div>
    <div class="account"><span class="avatar" id="avatar">Y</span><span style="line-height:1.25"><b id="who">Your account</b><br><small id="plan" style="color:var(--muted)"></small></span></div>
  </aside>
  <button class="scrim" id="scrim" aria-label="Close menu"></button>
  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;min-width:0">
        <button class="icon hamburger" id="burger" aria-label="Open menu: chats, skills, settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span class="title" id="title">New chat</span>
      </div>
      <div style="display:flex;align-items:center">
        <button class="icon" id="themeBtn" aria-label="Switch dark or light"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button class="icon" id="newTop" aria-label="New chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="scroll" id="scroll"><div class="thread" id="thread" aria-live="polite"></div></div>
    <button class="down" id="down" aria-label="Jump to the newest message"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="composer">
      <div class="box" id="box">
        <div class="menu" id="modelMenu" hidden></div>
        <div class="menu" id="effortMenu" hidden></div>
        <div class="card">
          <label class="sr" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Message Yuvra..." maxlength="20000"></textarea>
          <div class="tools">
            <div class="left">
              <button class="pill plain" id="plus" aria-label="Attach, skills, web search (coming soon)" disabled style="width:44px;justify-content:center;font-size:22px">+</button>
              <button class="pill" id="modelBtn" aria-haspopup="true" aria-label="Choose model"></button>
              <button class="pill plain" id="effortBtn" aria-haspopup="true" aria-label="Choose effort"></button>
            </div>
            <button class="send" id="send" aria-label="Send">&uarr;</button>
          </div>
        </div>
        <div class="usage" id="usage"><span id="pop"></span><div class="bar"><div id="barFill" style="width:100%"></div></div><button id="usageBtn" aria-label="Open usage details"></button></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="login" hidden>
  <form class="dialog" id="loginForm">
    <div class="brand" style="padding:0" id="loginBrand"></div>
    <h2>Enter your key</h2>
    <p style="margin:0;color:var(--muted)">Open the link the server printed, or paste your key here.</p>
    <label class="sr" for="keyInput">Key</label>
    <input type="password" id="keyInput" autocomplete="off" placeholder="Your key">
    <div id="loginErr" style="color:var(--danger)"></div>
    <button class="btn" type="submit">Continue</button>
  </form>
</div>
<div id="dialogs"></div>

<script>
'use strict';
// ---------------------------------------------------------------- palettes (design/brand-tokens.json)
const MODEL = {
  Ember:    {dark: {accent:'#C8431F', onaccent:'#FFFFFF', accenttext:'#F0734F', sun:'#C8431F', core:'#FFB05A', glow:'rgba(200,67,31,.20)'}, light: {accent:'#B7391E', onaccent:'#FFFFFF', accenttext:'#8F2A14', sun:'#A8321A', core:'#FF9A3C', glow:'rgba(183,57,30,.14)'}},
  Flare:    {dark: {accent:'#FF4B1F', onaccent:'#1A0500', accenttext:'#FF6B3D', sun:'#FF4B1F', core:'#FFF3E6', glow:'rgba(255,75,31,.20)'}, light: {accent:'#FF4B1F', onaccent:'#1A0500', accenttext:'#B83208', sun:'#E5340A', core:'#FFF3E6', glow:'rgba(255,75,31,.12)'}},
  Equinox:  {dark: {accent:'#EEF0F6', onaccent:'#07080D', accenttext:'#EEF0F6', sun:'#EEF0F6', core:'#07080D', glow:'rgba(238,240,246,.08)'}, light: {accent:'#0D0F1A', onaccent:'#FFFFFF', accenttext:'#0D0F1A', sun:'#0D0F1A', core:'#FFFFFF', glow:'rgba(13,15,26,.07)'}},
  Solstice: {dark: {accent:'#F2A60C', onaccent:'#1F1400', accenttext:'#FFBE3B', sun:'#F2A60C', core:'#FFE7A0', glow:'rgba(242,166,12,.18)'}, light: {accent:'#F2A60C', onaccent:'#1F1400', accenttext:'#8A5A00', sun:'#D18A00', core:'#FFE7A0', glow:'rgba(242,166,12,.13)'}},
  Apogee:   {dark: {accent:'#A8D1F5', onaccent:'#06121F', accenttext:'#B5D8F8', sun:'#A8D1F5', core:'#F4F9FF', glow:'rgba(168,209,245,.15)'}, light: {accent:'#A8D1F5', onaccent:'#06121F', accenttext:'#2A5F96', sun:'#4F8FC9', core:'#F4F9FF', glow:'rgba(120,170,220,.15)'}}
};
const BASE = {
  dark:  {bg:'#07080D', side:'#0A0B11', surface:'#0F1119', surface2:'#161926', line:'#232739', text:'#EEF0F6', muted:'#9AA3BC'},
  light: {bg:'#F7F8FC', side:'#EEF0F7', surface:'#FFFFFF', surface2:'#EEF0F7', line:'#D8DCEA', text:'#0D0F1A', muted:'#4A526B'}
};
const SUMMARY_MARK = '[Earlier in this chat, shortened to save room]';
const BRAIN = 'M32 56 C22 56 12 51 10 41 C5 37 5 28 11 24 C10 16 18 8 26 11 C29 6 35 6 38 11 C46 8 54 16 53 24 C59 28 59 37 54 41 C52 51 42 56 32 56 Z';
const $ = (id) => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const logo = (size, animate) => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 64 64'); s.setAttribute('fill', 'none'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = `<path d="${BRAIN}" stroke="var(--text)" stroke-width="4" stroke-linejoin="round"${animate ? ' stroke-dasharray="40 14"><animate attributeName="stroke-dashoffset" from="0" to="-108" dur="2.4s" repeatCount="indefinite"/></path>' : '/>'}
    <path d="M32 55 V36 M32 36 L21 18 M32 36 L43 18" stroke="var(--text)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="core" cx="32" cy="36" r="6.5">${animate ? '<animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>' : ''}</circle>`;
  return s;
};
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const nice = (n) => fmt(n >= 100 ? Math.round(n / 10) * 10 : Math.round(n));

// ---------------------------------------------------------------- state
const S = {state: null, chatId: null, messages: [], title: 'New chat', private: false, model: null, effort: 'balanced', busy: false, abort: null,
           theme: localStorage.getItem('yuvra_theme') || 'dark', shown: null, stick: true, thinkTimer: null};
try { S.model = localStorage.getItem('yuvra_model'); S.effort = localStorage.getItem('yuvra_effort') || 'balanced'; } catch (e) {}
if (!['auto', 'quick', 'balanced', 'deep'].includes(S.effort)) S.effort = 'balanced';

async function api(path, opts) {
  const r = await fetch(path, Object.assign({credentials: 'same-origin', headers: {'Content-Type': 'application/json'}}, opts));
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  return r;
}
const post = (path, body) => api(path, {method: 'POST', body: JSON.stringify(body || {})});

// ---------------------------------------------------------------- theme
function allModels() { return S.state ? S.state.models.cards.concat(S.state.models.other || []) : []; }
function curModel() { return allModels().find((m) => m.id === S.model) || null; }
function applyTheme() {
  const mode = S.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : S.theme;
  document.documentElement.dataset.mode = mode;
  const m = curModel(), p = Object.assign({}, BASE[mode], (MODEL[m ? m.name : 'Flare'] || MODEL.Flare)[mode]);
  for (const k in p) document.documentElement.style.setProperty('--' + k, p[k]);
  document.querySelector('meta[name=theme-color]').content = p.bg;
}
function wash() { const w = el('div', {class: 'wash'}); document.body.append(w); setTimeout(() => w.remove(), 1100); }

// ---------------------------------------------------------------- load
async function load() {
  const q = new URLSearchParams({effort: S.effort}); if (S.model) q.set('model', S.model);
  const r = await api('/api/state?' + q);
  S.state = await r.json();

// ---------------------------------------------------------------- chats
async function newChat(isPrivate) {

  document.body.classList.remove('menu-open'); renderThread(); $('input').focus(); renderChats();
}
async function openChat(id) {
  if (S.busy) return;

// ---------------------------------------------------------------- thread
function bubble(m, last) {
  if (m.role === 'user' && m.content.startsWith(SUMMARY_MARK)) return el('div', {class: 'note'}, 'Earlier messages were summarized to save room');
  if (m.role === 'user') return el('div', {class: 'msg user'}, el('div', {class: 'bubble'}, m.content));
  const model = allModels().find((c) => c.id === m.model_id);
  const meta = el('div', {class: 'meta'}, logo(14), (model ? model.name + (model.older ? ' ' + model.version : '') : 'Yuvra') + (m.status === 'partial' ? ' · stopped' : ''));
  const acts = el('div', {class: 'acts'}, el('button', {class: 'chip', onclick: (e) => { navigator.clipboard && navigator.clipboard.writeText(m.content); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1500); }}, 'Copy'));
  if (last && !S.busy) acts.append(el('button', {class: 'chip', 'aria-haspopup': 'true', onclick: (e) => regenMenu(e.currentTarget)}, 'Regenerate \u25be'));
  return el('div', {class: 'msg ai', 'data-id': m.id}, meta, el('div', {class: 'bubble'}, m.content), acts);
}
function renderThread(jump) {
  const t = $('thread'); t.replaceChildren();
  $('title').textContent = S.title;
  if (S.private) t.append(el('div', {class: 'note'}, 'Private chat: not saved, and gone when you leave it'));
  if (!S.messages.length) t.append(el('div', {class: 'empty'}, logo(64), el('h1', {}, 'How can I help?'), el('div', {}, 'Ask anything. Pick a model and how much it should think under the box.')));
  const last = [...S.messages].reverse().find((m) => m.role === 'assistant');
  S.messages.forEach((m) => t.append(bubble(m, last && m.id === last.id && m === S.messages[S.messages.length - 1])));
  if (jump !== false) scrollDown(true);
}
function scrollDown(force) { const s = $('scroll'); if (force || S.stick) s.scrollTop = s.scrollHeight; }
$('scroll').addEventListener('scroll', () => { const s = $('scroll'); S.stick = s.scrollHeight - s.scrollTop - s.clientHeight < 60; $('down').classList.toggle('show', !S.stick); });
$('down').onclick = () => { S.stick = true; scrollDown(true); };

// ---------------------------------------------------------------- composer

function closeMenus() { $('modelMenu').hidden = true; $('effortMenu').hidden = true; }

    m.append(el('button', {class: 'opt' + (e.id === S.effort ? ' sel' : ''), disabled: blocked, onclick: () => { S.effort = e.id; S.autoNote = null; try { localStorage.setItem('yuvra_effort', e.id); } catch (x) {} closeMenus(); renderComposer(); refreshUsage(); }},
      el('span', {class: 'grow'}, el('b', {}, e.name), ' ', el('small', {style: 'display:inline'}, '· ' + e.use), el('small', {}, blocked ? 'Needs Flare or a bigger model.' : e.blurb)), e.id === S.effort ? '✓' : '')); }

document.addEventListener('click', (e) => { if (!e.target.closest('.box')) closeMenus(); });

const input = $('input');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; });

$('burger').onclick = () => document.body.classList.add('menu-open');

// ---------------------------------------------------------------- usage line (the numbers ease to their new value)
let tween = null;
function renderUsage(u, instant) {
  const exempt = u.exempt;
  const target = exempt ? 1 : Math.min(u.tank.pct, u.week.pct_left) / 100;
  const draw = (frac, msgs) => {
    $('barFill').style.width = Math.max(0, Math.min(100, frac * 100)) + '%';
    $('usage').classList.toggle('low', !exempt && frac <= 0.2);
    $('usageBtn').textContent = exempt ? 'Usage: no limit (owner)' : (u.can_send <= 0 ? 'Usage: out for now. Tap for details' : 'Usage: ' + Math.round(frac * 100) + '% · about ' + fmt(msgs) + ' messages left');
  };
  const from = S.shown == null || instant ? {frac: target, msgs: u.can_send} : S.shown;
  S.shown = {frac: from.frac, msgs: from.msgs}; S.lastUsage = u;
  clearInterval(tween);
  if (instant || (Math.abs(from.frac - target) < 0.001 && from.msgs === u.can_send)) { S.shown = {frac: target, msgs: u.can_send}; draw(target, u.can_send); return; }
  tween = setInterval(() => {
    S.shown.frac += (target - S.shown.frac) * 0.16; S.shown.msgs += (u.can_send - S.shown.msgs) * 0.16;
    if (Math.abs(S.shown.frac - target) < 0.0005) { S.shown = {frac: target, msgs: u.can_send}; clearInterval(tween); }
    draw(S.shown.frac, S.shown.msgs);
  }, 30);
}
function popTokens(before, after) {
  if (!before || before.exempt || !after) return; const used = before.tank.left - after.tank.left;
  if (used < 1) return; const p = $('pop'); p.className = 'pop'; p.textContent = '+' + fmt(used) + ' tokens'; p.style.animation = 'none'; void p.offsetWidth; p.style.animation = ''; setTimeout(() => { p.textContent = ''; p.className = ''; }, 1400);
}
async function refreshUsage() {
  const q = new URLSearchParams({effort: S.effort, model: S.model}); const r = await api('/api/state?' + q); const st = await r.json();
  S.state.usage = st.usage; S.state.window = st.window; renderUsage(st.usage);
}
$('usageBtn').onclick = openUsage;
function openUsage() {
  const u = S.lastUsage || S.state.usage; const mk = (t, c) => el('div', {class: 'kv'}, el('span', {}, t), el('span', {}, c));
  const resets = new Date(u.week.resets_at * 1000), full = new Date(u.tank.full_at * 1000);
  const body = [el('h2', {}, 'Usage'), el('div', {style: 'color:var(--muted)'}, 'Status: ' + u.status)];
  if (u.exempt) body.push(el('div', {}, 'You are the owner, so nothing is limited or counted.'));
  else body.push(
    el('b', {}, 'Right now'), el('div', {class: 'big'}, el('div', {style: 'width:' + u.tank.pct + '%'})),
    mk('Left in your tank', fmt(u.tank.left) + ' of ' + fmt(u.tank.cap) + ' tokens'), mk('About', fmt(u.tank.messages_left) + ' messages'),
    mk('Refills', fmt(u.tank.refill_per_hour) + ' tokens an hour'), mk('Full again', u.tank.pct >= 99.5 ? 'Already full' : full.toLocaleString([], {weekday: 'short', hour: 'numeric', minute: '2-digit'})),
    el('b', {}, 'This week'), el('div', {class: 'big'}, el('div', {style: 'width:' + u.week.pct_left + '%'})),
    mk('Left this week', fmt(u.week.left) + ' of ' + fmt(u.week.cap) + ' tokens'), mk('About', fmt(u.week.messages_left) + ' messages'),
    mk('Resets', resets.toLocaleString([], {weekday: 'long', hour: 'numeric', minute: '2-digit'})),
    el('b', {}, 'Messages left, by model'), ...u.models.map((m) => mk(m.model[0].toUpperCase() + m.model.slice(1), '≈ ' + fmt(m.messages_left))),
    el('div', {style: 'color:var(--muted);font-size:14px'}, 'A normal message is about 500 tokens on Flare. Bigger models and Deep thinking use more. Models running on your own device are never counted.'));
  dialog(body, 'Close');
}
function dialog(children, closeText, extra) {
  const m = el('div', {class: 'modal', role: 'dialog', 'aria-modal': 'true', onclick: (e) => { if (e.target === m) m.remove(); }},
    el('div', {class: 'dialog'}, ...children, extra || null, el('button', {class: 'btn ghost', onclick: () => m.remove()}, closeText || 'Close')));
  $('dialogs').append(m); return m;
}

// ---------------------------------------------------------------- settings
async function openSettings() {
  const st = S.state, s = st.settings, w = st.window;
  const seg = (opts, cur, fn) => el('div', {class: 'seg'}, ...opts.map(([v, t]) => el('button', {class: cur === v ? 'on' : '', onclick: (e) => { fn(v); [...e.target.parentNode.children].forEach((b) => b.classList.remove('on')); e.target.classList.add('on'); }}, t)));
  const kids = [el('h2', {}, 'Settings'),
    el('b', {}, 'Look'), seg([['auto', 'Automatic'], ['dark', 'Dark'], ['light', 'Light']], S.theme, (v) => { S.theme = v; try { localStorage.setItem('yuvra_theme', v); } catch (e) {} applyTheme(); }),
    el('b', {}, 'How long a chat can be'), seg([['everyday', 'Everyday (about 8K)'], ['long', 'Long (if allowed)']], s.window_mode, async (v) => { await post('/api/settings', {window_mode: v}); await load(); }),
    el('div', {style: 'color:var(--muted);font-size:14px'}, 'Right now: ' + fmt(w.window) + ' tokens, ' + w.reason + '. Long chats use more memory and are slower to read.'),
    el('b', {}, 'Your data'),
    el('div', {style: 'color:var(--muted);font-size:14px'}, 'Chats are saved on the server you opened this page from. Private chats are never saved. Nothing leaves it unless you attach an online model.'),
    el('button', {class: 'btn danger', onclick: async () => { if (confirm('Delete every chat? This cannot be undone.')) { await post('/api/delete-everything'); S.chatId = null; S.messages = []; await load(); } }}, 'Delete all my chats')];
  if (st.owner) {
    const name = el('input', {type: 'text', placeholder: 'Name, e.g. sam', 'aria-label': 'Tester name'}), out = el('div', {style: 'word-break:break-all;color:var(--muted);font-size:14px'});
    let plan = 'free';
    kids.push(el('b', {}, 'Owner: testers and plans'), name, seg([['free', 'Free'], ['pro', 'Pro'], ['mega', 'Mega']], 'free', (v) => { plan = v; }),
      el('button', {class: 'btn', onclick: async () => { const r = await post('/api/admin/users', {user: name.value.trim(), tier: plan}); const j = await r.json();
        out.textContent = r.ok ? 'Share this link privately: ' + location.origin + '/?key=' + j.key : j.message; }}, 'Add or change tester'), out,
      el('button', {class: 'btn ghost', onclick: async () => { const r = await post('/api/admin/pause', {paused: true}); out.textContent = 'Paused: everyone except the owner is stopped. Reload to resume after restarting the server.'; }}, 'Pause everyone'),
      el('button', {class: 'btn ghost', onclick: async () => { await post('/api/admin/pause', {paused: false}); out.textContent = 'Resumed.'; }}, 'Resume'));
  }

}

// ---------------------------------------------------------------- sending
function thinkingNode() {
  const words = S.state.thinking_words, word = el('span', {class: 'word'}, words[0]); let i = 0;
  const node = el('div', {class: 'thinking', 'aria-label': 'Thinking'}, logo(34, true), word, el('span', {class: 'dots'}, ...'...'.split('').map((d) => el('span', {}, d))));
  S.thinkTimer = setInterval(() => { i++; word.textContent = words[i % words.length]; word.style.animation = 'none'; void word.offsetWidth; word.style.animation = ''; }, S.state.think_switch_s * 1000);
  node._stop = () => { clearInterval(S.thinkTimer); S.thinkTimer = null; };
  return node;
}
async function send(regen, mode) {
  if (S.busy) return;
  const text = regen === true ? '' : input.value.trim(); if (regen !== true && !text) return;
  if (!S.chatId) { const r = await post('/api/chats', {private: S.private}); if (!r.ok) return; S.chatId = (await r.json()).id; }
  S.busy = true; S.stick = true; renderComposer(); closeMenus();
  if (regen === true) { const last = S.messages[S.messages.length - 1]; if (last && last.role === 'assistant') S.messages.pop(); }
  else { S.messages.push({id: 'u' + Date.now(), role: 'user', content: text}); input.value = ''; input.style.height = 'auto'; }
  renderThread(); const before = S.lastUsage;
  const think = thinkingNode(); $('thread').append(think); scrollDown(true);
  let aiBubble = null, aiWrap = null, got = '', errCard = null;
  S.abort = new AbortController();
  try {
    const r = await fetch('/api/chats/' + S.chatId + '/send', {method: 'POST', credentials: 'same-origin', signal: S.abort.signal, headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, model: S.model, effort: S.effort, regenerate: regen === true, regen_mode: mode || null})});
    if (r.status === 401) { showLogin(); throw new Error('login'); }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw Object.assign(new Error(j.message || 'Something went wrong.'), {info: j, status: r.status, retry: r.headers.get('Retry-After')}); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    const handle = (ev, data) => {
      if (ev === 'thinking') {
        S.autoNote = data.auto ? data : null; renderComposer();
      } else if (ev === 'loading') {
        const w = think.querySelector('.word'); clearInterval(S.thinkTimer); S.thinkTimer = null; if (w) w.textContent = 'Loading ' + data.model + ' (first message only)';
      } else if (ev === 'piece') {
        if (!aiWrap) { think._stop(); think.remove(); const m = curModel(); aiBubble = el('div', {class: 'bubble'}); const note = S.autoNote ? el('span', {title: S.autoNote.reason}, ' \u00b7 Auto chose ' + S.autoNote.effort[0].toUpperCase() + S.autoNote.effort.slice(1)) : null;
        aiWrap = el('div', {class: 'msg ai'}, el('div', {class: 'meta'}, logo(14), m ? m.name : 'Yuvra', note), aiBubble); $('thread').append(aiWrap); }
        got += data.t; aiBubble.replaceChildren(got, el('span', {class: 'cursor'}, '▍')); scrollDown();
      } else if (ev === 'done') {
        S.title = data.title || S.title; S.state.usage = data.usage; renderUsage(data.usage); popTokens(before, data.usage);
        if (data.compacted) $('thread').insertBefore(el('div', {class: 'note'}, 'Earlier messages were summarized to save room'), aiWrap);
      } else if (ev === 'error') { throw Object.assign(new Error(data.message), {info: data, status: data.http}); }
    };
    for (;;) {
      const {value, done} = await reader.read(); if (done) break; buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf('\n\n')) >= 0) { const block = buf.slice(0, i); buf = buf.slice(i + 2); let ev = 'message', data = '';
        for (const line of block.split('\n')) { if (line.startsWith('event:')) ev = line.slice(6).trim(); else if (line.startsWith('data:')) data += line.slice(5).trim(); }
        if (data) handle(ev, JSON.parse(data)); }
    }
  } catch (e) {
    if (e.name !== 'AbortError' && e.message !== 'login') errCard = errorCard(e);
  } finally {
    think._stop && think._stop(); think.remove(); S.busy = false; S.abort = null;
  }
    try { const r = await api('/api/chats/' + S.chatId); if (r.ok) { const c = await r.json(); S.messages = c.messages; S.title = c.title; } } catch (e) {}
  renderThread(); if (errCard) { $('thread').append(errCard); scrollDown(true); if (!got && regen !== true) input.value = text; }
  renderComposer(); try { const q = new URLSearchParams({effort: S.effort, model: S.model}); const r = await api('/api/state?' + q); const st = await r.json(); S.state.chats = st.chats; S.state.usage = st.usage; renderChats(); renderUsage(st.usage); } catch (e) {}
}
function errorCard(e) {
  const i = e.info || {}, card = el('div', {class: 'err', role: 'alert'}, el('b', {}, e.message || 'Something went wrong.'));
  if (i.action) card.append(el('div', {}, i.action));
  if (i.code === 'tank_empty' || i.code === 'week_limit') {
    const secs = Number(e.retry || i.retry_after || 0), when = i.code === 'week_limit' && i.resets_at ? 'It resets ' + new Date(i.resets_at * 1000).toLocaleString([], {weekday: 'long', hour: 'numeric', minute: '2-digit'}) + '.'
      : (secs ? 'Try again in about ' + (secs >= 3600 ? Math.ceil(secs / 3600) + ' hours' : Math.max(1, Math.ceil(secs / 60)) + ' minutes') + '.' : '');
    card.append(el('div', {style: 'color:var(--muted)'}, when + ' Models on your own device are not counted.'));
  }
  return card;
}
function stop() { if (S.chatId != null) post('/api/chats/' + S.chatId + '/stop').catch(() => {}); }
function regenMenu(btn) {
  const wrap = btn.closest('.msg'), old = wrap.querySelector('.regen');
  if (old) { old.remove(); return; }
  const m = el('div', {class: 'regen', role: 'menu'}, el('div', {class: 'head'}, 'HOW SHOULD THE NEW ANSWER DIFFER?'),
    ...S.state.regen_options.map((o) => el('button', {class: 'opt', role: 'menuitem', onclick: () => { m.remove(); send(true, o.id); }},
      el('span', {class: 'grow'}, el('b', {}, o.label), el('small', {}, o.blurb)))));
  wrap.append(m); scrollDown(true);
}
