<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emvryx</title>
<meta name="theme-color" content="#07080D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emvryx">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg:#07080D; --side:#0A0B11; --surface:#0F1119; --surface2:#161926; --line:#232739; --text:#EEF0F6; --muted:#9AA3BC;
  --accent:#F5A524; --onaccent:#1A1204; --accenttext:#F5A524; --sun:#F5A524; --core:#FFD27A; --glow:rgba(245,165,36,.14);   /* brand amber until a model's colours apply */
  --danger:#E5484D;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 'DM Sans', system-ui, sans-serif; overflow: hidden;
  background-image: radial-gradient(900px 420px at 62% -10%, var(--glow), transparent 70%); }
body, .tx { transition: background-color .6s ease, color .6s ease; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg .core { fill: var(--core); stroke: var(--sun); stroke-width: 3; transition: fill .6s, stroke .6s; }
.app { display: flex; height: 100%; height: calc(100dvh / var(--z, 1)); zoom: var(--z, 1); }   /* --z is the person's text size (Settings > Look) */
/* sidebar (always on wide screens, a drawer on phones) */
.side { position: relative; width: 288px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 20px 8px; font: 600 20px 'Sora', sans-serif; letter-spacing: -0.02em; }
.newchat { margin: 12px 14px 6px; background: var(--accent); color: var(--onaccent); border: 0; border-radius: 14px; min-height: 46px; font-weight: 600; }
.chats { flex: 1; overflow-y: auto; padding: 4px 14px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--muted); opacity: .8; padding: 14px 6px 2px; }
.row { display: flex; align-items: center; border-radius: 12px; }
.row.cur { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
.row button.open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 8px 12px; min-height: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row button.del { background: transparent; border: 0; color: var(--muted); width: 40px; height: 44px; opacity: 0; }
.row:hover button.del, .row:focus-within button.del { opacity: 1; }
.links { border-top: 1px solid var(--line); padding: 8px 14px; }
.link { display: flex; width: 100%; align-items: center; gap: 12px; background: transparent; border: 0; border-radius: 12px; padding: 0 12px; min-height: 40px; text-align: left; font-weight: 500; }
.link:hover:not([disabled]) { background: var(--surface2); }
.link svg { flex-shrink: 0; color: var(--muted); }
.link small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.account { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 12px 16px; text-align: left; border-radius: 0; }
.account:hover { background: var(--surface2); }
.account .chev { margin-left: auto; color: var(--muted); }
.acctmenu { position: absolute; left: 12px; right: 12px; bottom: 70px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 5; }
.acctmenu[hidden] { display: none; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--accent); color: var(--onaccent); display: grid; place-items: center; font-weight: 700; }
.scrim { display: none; }
/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.top { height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--line); }
.top .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
.icon { background: transparent; border: 0; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
.icon:hover { background: var(--surface2); }
.hamburger { display: none; }
.banner { background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 8px 16px; text-align: center; }
.banner b { color: var(--accenttext); font-weight: 600; }
.scroll { flex: 1; overflow-y: auto; scroll-behavior: auto; padding: 24px 16px 8px; }
.thread { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; }
.msg { display: flex; flex-direction: column; gap: 6px; animation: rise .35s ease both; }
.msg.user { align-self: flex-end; max-width: 80%; }
.msg.user .bubble { background: var(--surface2); border-radius: 18px 18px 4px 18px; padding: 12px 16px; }
.msg.ai { align-self: flex-start; max-width: 94%; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 14px 18px; }
.bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; min-height: 36px; font-size: 14px; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.note { align-self: center; color: var(--muted); font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }
.cursor { display: inline-block; width: .55em; color: var(--accenttext); animation: blink 1s steps(2) infinite; }
.thinking { align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 6px 4px; animation: rise .3s ease both; }
.thinking svg { overflow: visible; animation: hop 1.1s ease-in-out infinite; }
.thinking .word { font-weight: 500; animation: rise .35s ease both; }
.thinking .dots span { animation: dot 1.2s infinite; display: inline-block; }
.thinking .dots span:nth-child(2) { animation-delay: .2s; }
.thinking .dots span:nth-child(3) { animation-delay: .4s; }
.err { align-self: stretch; background: var(--surface); border: 1px solid var(--danger); border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.err b { color: var(--danger); }
.empty { text-align: center; color: var(--muted); margin: auto; padding: 40px 0; }
.empty h1 { font: 600 32px 'Sora', sans-serif; color: var(--text); margin: 12px 0 6px; letter-spacing: -0.02em; }
.down { position: absolute; right: 24px; bottom: 170px; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; width: 44px; height: 44px; display: none; place-items: center; z-index: 5; }
.down.show { display: grid; }
/* composer */
.composer { flex-shrink: 0; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
.box { max-width: 760px; margin: 0 auto; position: relative; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 10px 10px 16px; display: flex; flex-direction: column; gap: 10px; }
.attached { display: flex; flex-wrap: wrap; gap: 6px; } .attached[hidden] { display: none; }
.attached .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; padding: 4px 10px; }
.attached .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52vw; }
.card textarea { width: 100%; background: transparent; border: 0; outline: none; resize: none; color: var(--text); font: inherit; max-height: 160px; padding: 0; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tools .left { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.pill { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; min-height: 44px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.pill.plain { background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; }
.send { background: var(--accent); color: var(--onaccent); border: 0; border-radius: 12px; width: 44px; height: 44px; font-size: 20px; font-weight: 700; flex-shrink: 0; }
.send[disabled] { opacity: .45; cursor: default; }
.send.stop { background: var(--surface2); color: var(--text); border: 1px solid var(--line); }
.menu { position: absolute; left: 0; bottom: 100%; margin-bottom: 10px; width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 20; animation: rise .2s ease both; }
.regen { align-self: stretch; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; animation: rise .2s ease both; }
.regen .head { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--muted); padding: 4px 6px; }
.menu .head { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--muted); padding: 4px 6px; }
.opt { text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-height: 44px; display: flex; align-items: center; gap: 12px; }
.opt.sel { border-color: var(--accent); }
.opt[disabled] { opacity: .5; cursor: default; }
.opt .grow { flex: 1; min-width: 0; } .opt > small { flex: 0 0 auto; max-width: 36%; font-size: 13px; } .opt small { color: var(--muted); display: block; font-size: 14px; }
.usage { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 0; position: relative; }
.usage button { background: transparent; border: 0; color: var(--muted); font-size: 13px; padding: 0; }
.bar { width: 220px; max-width: 70%; height: 5px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s linear; }
.usage.low .bar > div { background: var(--danger); } .usage.low button { color: var(--danger); }
.pop { position: absolute; right: 8px; top: -8px; font-size: 13px; font-weight: 600; color: var(--accenttext); animation: floatup 1.3s ease-out both; pointer-events: none; }
/* VryxCode screen */
.code { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.code[hidden] { display: none; }
.code .top2 { height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; }
.code .top2 .title { font: 600 18px 'Sora', sans-serif; flex: 1; white-space: nowrap; padding-left: 4px; }
.code .top2 .chip { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 11px; font-size: 13px; flex-shrink: 0; } .code .top2 #codeProj { flex-shrink: 1; min-width: 0; max-width: 26vw; }
.code .main2 { flex: 1; min-height: 0; display: flex; position: relative; }
.code .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.code .feed { flex: 1; overflow-y: auto; padding: 8px 16px 12px; }
.code .feedin { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
.code pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
.code .you { align-self: flex-end; max-width: 85%; background: var(--surface2); border-radius: 18px 18px 4px 18px; padding: 10px 14px; }
.code details.step { border-radius: 12px; }
.code details.step summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; color: var(--muted); font-size: 15px; min-height: 40px; }
.code details.step summary::-webkit-details-marker { display: none; }
.code details.step summary:hover { background: var(--surface); }
.code details.step .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); flex-shrink: 0; }
.code details.step.ok .dot { background: var(--accent); } .code details.step.no .dot { background: var(--danger); }
.code details.step .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.code details.step .more { padding: 4px 10px 10px 28px; display: flex; flex-direction: column; gap: 8px; }
.code details.step .more pre { color: var(--muted); max-height: 240px; overflow: auto; }
.code .ask, .code .fin, .code .bad { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.code .ask { border-color: var(--accent); } .code .bad { border-color: var(--danger); }
.code .ask b, .code .fin b { font-weight: 600; } .code .bad b { color: var(--danger); }
.code .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.code .small { min-height: 40px; padding: 0 16px; border-radius: 12px; font-weight: 600; }
.code .empty { margin: auto 0; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding-bottom: 8vh; }
.code .empty h1 { margin: 0; font: 600 30px 'Sora', sans-serif; letter-spacing: -0.02em; }
.code .empty p { margin: 0; color: var(--muted); max-width: 460px; }
.code .tip { color: var(--muted); font-size: 13px; text-align: center; padding: 6px 0 0; }
.code .menu { bottom: auto; top: 100%; left: auto; right: 0; margin: 6px 0 0; width: min(320px, 92vw); z-index: 5; }
.code .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 4; box-shadow: -12px 0 32px rgba(0,0,0,.25); }
.code .drawer[hidden] { display: none; }
.code .drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 16px; font-weight: 600; }
.code .flist { max-height: 38%; overflow-y: auto; padding: 0 8px 8px; }
.code .flist button { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 8px; font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 36px; }
.code .flist button:hover, .code .flist button.on { background: var(--surface2); }
.code .viewer { flex: 1; overflow: auto; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
/* VryxCode: a work log in Emvryx's own style: an ember mark for you, plain words from the model, one card per action with a coloured edge, a living "working" line */
.code .feedin { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 14px; line-height: 1.55; gap: 6px; }
.code .cc-user { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0 14px; margin-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--text); white-space: pre-wrap; word-break: break-word; }
.code .cc-user .ember { flex-shrink: 0; width: 10px; height: 10px; margin-top: 6px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.code .cc-say { color: var(--text); white-space: pre-wrap; word-break: break-word; padding: 4px 0 2px; }
.code .cc-tool { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 6px 12px; border-left: 3px solid var(--line); background: var(--surface); border-radius: 4px 12px 12px 4px; }
.code .cc-tool.run { border-left-color: var(--accent); } .code .cc-tool.ok { border-left-color: #3fb950; } .code .cc-tool.no { border-left-color: var(--danger); }
.code .cc-head { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.code .cc-verb { font-weight: 700; flex-shrink: 0; }
.code .cc-arg { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code .cc-tool.run .cc-verb { animation: ccglow 1.4s ease-in-out infinite; }
.code .cc-res, .code .cc-diff, .code .cc-more { padding-left: 2px; }
.code .cc-res { color: var(--muted); display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.code .cc-res .arrow { flex-shrink: 0; } .code .cc-res .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code .cc-tool.open .cc-res .txt { white-space: pre-wrap; word-break: break-word; }
.code .cc-diff { margin-top: 4px; border-radius: 8px; overflow: hidden; }
.code .cc-diff div { white-space: pre-wrap; word-break: break-word; padding: 0 8px; }
.code .cc-diff .add { color: #3fb950; background: rgba(63,185,80,.12); } .code .cc-diff .del { color: #f85149; background: rgba(248,81,73,.12); } .code .cc-diff .hdr { color: var(--muted); }
.code .cc-more { color: var(--muted); max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; display: none; }
.code .cc-tool.open .cc-more { display: block; }
.code .cc-live { display: flex; flex-direction: column; gap: 4px; padding: 10px 0 2px; }
.code .cc-live .l1 { display: flex; gap: 10px; align-items: center; color: var(--accenttext); }
.code .cc-live .mark { display: inline-flex; animation: ccpulse 1.2s ease-in-out infinite; }
.code .cc-live .what { transition: opacity .25s; } .code .cc-live .what.swap { opacity: 0; }
.code .cc-live .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code .cc-live .prose { color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 7.5em; overflow: hidden; padding-left: 30px; }
.code .cc-end { padding: 12px 0 4px; display: flex; gap: 10px; align-items: baseline; white-space: pre-wrap; word-break: break-word; }
.code .cc-end.good .mark { color: #3fb950; } .code .cc-end.bad .mark { color: var(--danger); } .code .cc-end.stop .mark { color: var(--muted); }
.code .cc-ask { border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin: 6px 0; background: var(--surface); }
.code .cc-ask .q { font-weight: 700; } .code .cc-ask pre { color: var(--muted); max-height: 220px; overflow: auto; }
.code .cc-msg { color: var(--text); padding: 6px 0 2px; display: flex; flex-direction: column; gap: 8px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
.code .cc-msg p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.code .cc-msg code.in { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--surface2); border-radius: 6px; padding: 1px 6px; }
.code .cc-msg.good { border-left: 3px solid #3fb950; padding-left: 12px; }
.code .cc-block { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.code .cc-block .bh { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; color: var(--muted); font: 12px ui-monospace, Menlo, Consolas, monospace; border-bottom: 1px solid var(--line); }
.code .cc-block .copy { background: transparent; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); padding: 2px 12px; min-height: 28px; font-size: 12px; }
.code .cc-block pre { padding: 8px 12px; overflow-x: auto; white-space: pre; }
.code .cc-next { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 6px; }
.code .cc-next .lead { color: var(--muted); font-size: 13px; width: 100%; }
.code .pv { position: absolute; inset: 0; z-index: 7; background: var(--bg); display: flex; flex-direction: column; }
.code .pv[hidden] { display: none; }
.code .pvbar { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px; border-bottom: 1px solid var(--line); }
.code .pvbar .title { font: 600 17px 'Sora', sans-serif; flex: 1; white-space: nowrap; padding-left: 4px; }
.code .pvbar .chip { min-height: 34px; padding: 4px 12px; text-decoration: none; display: inline-flex; align-items: center; }
.code .pvbar .chip.on { border-color: var(--accent); color: var(--text); }
.code .pvstage { flex: 1; min-height: 0; display: flex; justify-content: center; background: var(--surface2); padding: 0; }
.code .pvstage iframe { border: 0; background: #fff; height: 100%; width: 100%; }
.code .pvstage[data-size="phone"] iframe { width: min(390px, 100%); } .code .pvstage[data-size="tablet"] iframe { width: min(768px, 100%); }
.code .pvfoot { flex-shrink: 0; border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; background: var(--surface); }
.code .pvfoot .good { color: #3fb950; } .code .pvfoot .bad { color: var(--danger); background: none; border: 0; padding: 0; display: block; }
.code .pvfoot ul { margin: 0; padding-left: 18px; color: var(--muted); font: 13px ui-monospace, Menlo, Consolas, monospace; max-height: 96px; overflow: auto; word-break: break-word; }
.code #codePreviewBtn.pulse { border-color: var(--accent); animation: ccglow 1.2s ease-in-out 4; }
@keyframes ccglow { 50% { opacity: .55; } } @keyframes ccpulse { 50% { transform: scale(.82); opacity: .7; } }
@media (max-width: 900px) { .code .drawer { width: 100%; box-shadow: none; } }
/* dialogs */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; width: min(520px, 100%); max-height: 90dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dialog > * { flex-shrink: 0; }   /* a long list scrolls instead of squashing its rows on top of each other */
.dialog h2 { margin: 0; font: 600 22px 'Sora', sans-serif; }
.dialog input[type=text], .dialog input[type=password] { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--text); padding: 12px; font: inherit; width: 100%; min-height: 44px; }
.dialog select, .dialog input[type=number], .dialog textarea.f { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--text); padding: 12px; font: inherit; width: 100%; min-height: 44px; }
.dialog textarea.f { min-height: 110px; resize: vertical; }
.dialog label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
.tabs { display: flex; gap: 8px; } .tabs .chip.on { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
.report { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 15px; line-height: 1.5; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; } .btnrow .btn { flex: 1 1 140px; }
.btn { background: var(--accent); color: var(--onaccent); border: 0; border-radius: 12px; min-height: 44px; padding: 0 18px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; } .kv span:first-child { color: var(--muted); }
.big { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; } .big > div { height: 100%; background: var(--accent); border-radius: 999px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; } .seg button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 40px; }
.seg button.on { border-color: var(--accent); color: var(--accenttext); }
.wash { position: fixed; left: 50%; top: 55%; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; border-radius: 50%; pointer-events: none; z-index: 40;
  background: radial-gradient(circle, var(--core) 0%, var(--accent) 30%, transparent 66%); animation: swell 1000ms ease-out both; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: none; } }
@keyframes floatup { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }
@keyframes hop { 0%, 100% { transform: none; } 20% { transform: scale(1.12, .88); } 45% { transform: translateY(-12px) rotate(-8deg) scale(.96, 1.06); } 70% { transform: rotate(6deg) scale(1.1, .9); } 85% { transform: translateY(-4px); } }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes swell { 0% { opacity: 0; transform: scale(.3); } 45% { opacity: .55; } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes slidein { 0% { transform: translateX(-30px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (max-width: 900px) {
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 312px; max-width: 86vw; display: none; }
  body.menu-open .side { display: flex; animation: slidein .28s ease both; }
  body.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); border: 0; z-index: 25; }
  .hamburger { display: grid; }
  .down { bottom: 190px; right: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<body>

  </aside>

  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;min-width:0">
        <button class="icon hamburger" id="burger" aria-label="Open menu: chats, skills, settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span class="title" id="title">New chat</span>

              <button class="pill" id="modelBtn" aria-haspopup="true" aria-label="Choose model"></button>
              <button class="pill plain" id="effortBtn" aria-haspopup="true" aria-label="Choose effort"></button>
            </div>
            <button class="send" id="send" aria-label="Send">&uarr;</button>
          </div>
        </div>
        <div class="usage" id="usage"><span id="pop"></span><div class="bar"><div id="barFill" style="width:100%"></div></div><button id="usageBtn" aria-label="Open usage details"></button></div>
      </div>
    </div>
  </main>
</div>

<div class="code" id="code" hidden>
  <div class="top2">
    <button class="icon" id="codeBack" aria-label="Back to chats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="title">VryxCode</span>
    <div style="position:relative"><button class="chip" id="codeProj" aria-haspopup="true"></button><div class="menu" id="codeProjMenu" hidden></div></div>
    <button class="chip" id="codePreviewBtn" disabled title="See what was built, live">Preview</button>

              <button class="send" id="codeGo" aria-label="Run">&uarr;</button>

    <div class="pv" id="codePv" hidden>

        <span class="title">Preview</span>
        <button class="chip" data-size="phone">Phone</button><button class="chip" data-size="tablet">Tablet</button><button class="chip" data-size="desktop">Wide</button>
        <button class="chip" id="pvReload" aria-label="Reload the preview">&#8635;</button>
      </div>

    <button class="btn" type="submit">Continue</button>
  </form>
</div>
<div id="dialogs"></div>

<script>
'use strict';
// ---------------------------------------------------------------- palettes (design/brand-tokens.json)
const MODEL = {
  Emvryx:   {dark: {accent:'#F5A524', onaccent:'#1A1204', accenttext:'#F5A524', sun:'#F5A524', core:'#FFD27A', glow:'rgba(245,165,36,.14)'}, light: {accent:'#F5A524', onaccent:'#1A1204', accenttext:'#8F5600', sun:'#E08A00', core:'#FFD27A', glow:'rgba(245,165,36,.12)'}},   // the brand amber, as on the website: shown before a model is known (login)
  Ember:    {dark: {accent:'#C8431F', onaccent:'#FFFFFF', accenttext:'#F0734F', sun:'#C8431F', core:'#FFB05A', glow:'rgba(200,67,31,.20)'}, light: {accent:'#B7391E', onaccent:'#FFFFFF', accenttext:'#8F2A14', sun:'#A8321A', core:'#FF9A3C', glow:'rgba(183,57,30,.14)'}},
  Flare:    {dark: {accent:'#FF4B1F', onaccent:'#1A0500', accenttext:'#FF6B3D', sun:'#FF4B1F', core:'#FFF3E6', glow:'rgba(255,75,31,.20)'}, light: {accent:'#FF4B1F', onaccent:'#1A0500', accenttext:'#B83208', sun:'#E5340A', core:'#FFF3E6', glow:'rgba(255,75,31,.12)'}},
  Equinox:  {dark: {accent:'#EEF0F6', onaccent:'#07080D', accenttext:'#EEF0F6', sun:'#EEF0F6', core:'#07080D', glow:'rgba(238,240,246,.08)'}, light: {accent:'#0D0F1A', onaccent:'#FFFFFF', accenttext:'#0D0F1A', sun:'#0D0F1A', core:'#FFFFFF', glow:'rgba(13,15,26,.07)'}},
  Solstice: {dark: {accent:'#F2A60C', onaccent:'#1F1400', accenttext:'#FFBE3B', sun:'#F2A60C', core:'#FFE7A0', glow:'rgba(242,166,12,.18)'}, light: {accent:'#F2A60C', onaccent:'#1F1400', accenttext:'#8A5A00', sun:'#D18A00', core:'#FFE7A0', glow:'rgba(242,166,12,.13)'}},
  Apogee:   {dark: {accent:'#A8D1F5', onaccent:'#06121F', accenttext:'#B5D8F8', sun:'#A8D1F5', core:'#F4F9FF', glow:'rgba(168,209,245,.15)'}, light: {accent:'#A8D1F5', onaccent:'#06121F', accenttext:'#2A5F96', sun:'#4F8FC9', core:'#F4F9FF', glow:'rgba(120,170,220,.15)'}}
};
const BASE = {
  dark:  {bg:'#07080D', side:'#0A0B11', surface:'#0F1119', surface2:'#161926', line:'#232739', text:'#EEF0F6', muted:'#9AA3BC'},
  light: {bg:'#F7F8FC', side:'#EEF0F7', surface:'#FFFFFF', surface2:'#EEF0F7', line:'#D8DCEA', text:'#0D0F1A', muted:'#4A526B'}
};
const SUMMARY_MARK = '[Earlier in this chat, shortened to save room]';
const $ = (id) => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
// The mark is an E whose middle arm runs into a glowing ring. Each model keeps the E and its own colours, and the ring
// grows with the model: Ember a coal, Flare a ring, Equinox ticks, Solstice rays, Apogee halos. `kind` 'brand' is Emvryx's
// own amber (login, sidebar); otherwise it is a model name, and the colours follow the page's model theme.
const LOGO_KINDS = ['ember', 'flare', 'equinox', 'solstice', 'apogee'];
const logoRays = (r1, r2, n, color) => Array.from({length: n}, (_, i) => { const a = i * 2 * Math.PI / n;
  return `<path d="M${(46 + r1 * Math.cos(a)).toFixed(1)} ${(32 + r1 * Math.sin(a)).toFixed(1)} L${(46 + r2 * Math.cos(a)).toFixed(1)} ${(32 + r2 * Math.sin(a)).toFixed(1)}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`; }).join('');
const logo = (size, animate, kind) => {
  const k = kind === 'brand' ? 'brand' : (LOGO_KINDS.includes((kind || '').toLowerCase()) ? kind.toLowerCase() : (LOGO_KINDS.includes(((curModel() || {}).name || '').toLowerCase()) ? curModel().name.toLowerCase() : 'flare'));
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 64 64'); s.setAttribute('fill', 'none'); s.setAttribute('aria-hidden', 'true');
  const pulse = (v) => animate ? `<animate attributeName="r" values="${v}" dur="1.6s" repeatCount="indefinite"/>` : '';
  const sun = k === 'brand' ? '#F5A524' : 'var(--sun)', main = k === 'apogee' ? 'var(--sun)' : 'var(--text)';
  let ring;
  if (k === 'brand') ring = `<circle cx="46" cy="32" r="5.5" stroke="#FFD27A" stroke-width="3">${pulse('4.5;7;4.5')}</circle><circle cx="46" cy="32" r="1.8" fill="#F5A524"/>`;
  else if (k === 'ember') ring = `<circle cx="45" cy="32" r="3.4" fill="${sun}">${pulse('2.6;4.4;2.6')}</circle>`;
  else if (k === 'apogee') ring = `<circle class="core" cx="46" cy="32" r="4.5" style="stroke-width:2.5">${pulse('4;6;4')}</circle><circle cx="46" cy="32" r="8.5" stroke="${sun}" stroke-width="1.6" stroke-opacity="0.7"/><circle cx="46" cy="32" r="12" stroke="${sun}" stroke-width="1.2" stroke-opacity="0.4"/>`;
  else ring = `<circle class="core" cx="46" cy="32" r="5.5">${pulse('4.5;7;4.5')}</circle>` + (k === 'equinox' ? logoRays(8.5, 11, 4, 'var(--text)') : k === 'solstice' ? logoRays(8.5, 11.5, 8, sun) : '');
  s.innerHTML = `<circle cx="46" cy="32" r="${k === 'ember' ? 9 : k === 'apogee' ? 15 : 12}" fill="${sun}" fill-opacity="0.16"/>
    <path d="M17 16 H41 M17 48 H41 M17 16 V48" stroke="${main}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 32 H${k === 'ember' ? 36 : 37}" stroke="${sun}" stroke-width="6" stroke-linecap="round"/>${ring}`;
  return s;
};
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const nice = (n) => fmt(n >= 100 ? Math.round(n / 10) * 10 : Math.round(n));

// ---------------------------------------------------------------- state
const S = {state: null, chatId: null, skill: '', skills: [], docs: [], messages: [], title: 'New chat', private: false, model: null, effort: 'balanced', busy: false, abort: null,
           theme: localStorage.getItem('emvryx_theme') || 'dark', shown: null, stick: true, thinkTimer: null};
try { S.model = localStorage.getItem('emvryx_model'); S.effort = localStorage.getItem('emvryx_effort') || 'balanced'; } catch (e) {}
if (!['auto', 'quick', 'balanced', 'deep'].includes(S.effort)) S.effort = 'balanced';

function remember() {   // the open chat, so the home-screen app reopens where you were (a private chat is never saved, so it is not remembered)
  try { if (S.chatId != null && S.chatId >= 0 && !S.private) localStorage.setItem('emvryx_chat', String(S.chatId)); else localStorage.removeItem('emvryx_chat'); } catch (e) {}
}
async function restoreChat() {   // once per page load, after the chat list is known
  if (S.restored) return; S.restored = true;
  let id = null; try { id = parseInt(localStorage.getItem('emvryx_chat'), 10); } catch (e) {}
  if (S.chatId == null && id >= 0 && S.state.chats.some((c) => c.id === id)) await openChat(id);
}
async function api(path, opts) {
  const r = await fetch(path, Object.assign({credentials: 'same-origin', headers: {'Content-Type': 'application/json'}}, opts));
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  return r;
}
const post = (path, body) => api(path, {method: 'POST', body: JSON.stringify(body || {})});

// ---------------------------------------------------------------- theme
function mname(m) { return m ? m.name + (m.version ? ' ' + m.version : '') : 'Emvryx'; }   // the name with its version: Flare 2.5
function allModels() { return S.state ? S.state.models.cards.concat(S.state.models.other || []) : []; }
function curModel() { return allModels().find((m) => m.id === S.model) || null; }
function applySize() {   // text size: 0.85 small .. 1.3 extra large, remembered on this device
  let z = 1; try { z = parseFloat(localStorage.getItem('emvryx_size')) || 1; } catch (e) {}
  document.documentElement.style.setProperty('--z', String(Math.min(1.4, Math.max(0.7, z))));
}
function applyTheme() {
  applySize();
  const mode = S.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : S.theme;
  document.documentElement.dataset.mode = mode;
  const m = curModel(), p = Object.assign({}, BASE[mode], (MODEL[m ? m.name : 'Emvryx'] || MODEL.Flare)[mode]);
  for (const k in p) document.documentElement.style.setProperty('--' + k, p[k]);
  document.querySelector('meta[name=theme-color]').content = p.bg;
}
function wash() { const w = el('div', {class: 'wash'}); document.body.append(w); setTimeout(() => w.remove(), 1100); }

// ---------------------------------------------------------------- load
async function load() {
  const q = new URLSearchParams({effort: S.effort}); if (S.model) q.set('model', S.model);
  const r = await api('/api/state?' + q);
  S.state = await r.json();
  if (!S.model || !allModels().some((m) => m.id === S.model && m.state === 'ready')) S.model = S.state.model;
  $('login').hidden = true; $('app').hidden = false;
  if (!S.skills.length) { try { S.skills = (await (await api('/api/skills')).json()).skills; } catch (e) {} }
  applyTheme(); renderAll();
  await restoreChat();
}
function renderAll() {
  const st = S.state;
  $('brand').replaceChildren(logo(32, false, 'brand'), 'Emvryx');
  $('who').textContent = st.user === 'owner' ? 'Owner' : st.user;
  $('avatar').textContent = (st.user[0] || 'Y').toUpperCase();
  $('plan').textContent = (st.owner ? 'Owner, no limits' : st.plan[0].toUpperCase() + st.plan.slice(1) + ' plan');
  if (st.demo) { $('banner').hidden = false; $('banner').replaceChildren(el('b', {}, 'Demo mode. '), 'No model is attached, so replies are a stand-in. Start the server with --llama to use a real model.'); } else $('banner').hidden = true;
  renderChats(); renderLinks(); renderComposer(); renderUsage(st.usage, true); renderThread();
}
function renderChats() {
  const box = $('chatList'); box.replaceChildren();
  const day = new Date(); day.setHours(0, 0, 0, 0);
  const today = S.state.chats.filter((c) => c.updated * 1000 >= day.getTime()), earlier = S.state.chats.filter((c) => c.updated * 1000 < day.getTime());
  const group = (name, list) => { if (!list.length) return; box.append(el('div', {class: 'label'}, name));

function closeModals() { document.querySelectorAll('.modal').forEach((m) => m.remove()); }
async function downloadDoc(text, format, title) {
  const r = await post('/api/export-doc', {text, format, title});

  const blob = await r.blob(), a = el('a', {href: URL.createObjectURL(blob), download: ((r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/) || [])[1] || 'document.' + format});

}

function openTool(t) {

  thinking: ['Thinking', 'Pondering', 'Working it out', 'Mulling it over', 'Sketching a plan', 'Weighing it up', 'Figuring it out'],
  writing: ['Writing', 'Drafting', 'Composing', 'Putting it into words', 'Shaping a reply'],
  build: ['Building', 'Crafting', 'Assembling', 'Putting together', 'Shaping'],
  test: ['Running the tests', 'Testing it', 'Checking it works', 'Trying it out', 'Putting it through its paces'],
  run: ['Running', 'Executing', 'Trying', 'Working on'],
  read: ['Reading', 'Studying', 'Looking through', 'Taking a look at'],
  look: ['Looking around', 'Scanning the project', 'Seeing what is here'],
  git: ['Working with git', 'Handling git'], github: ['Talking to GitHub', 'Syncing with GitHub'], check: ['Checking', 'Looking for problems']};
const TOOL_KIND = {write_file: 'build', edit_file: 'build', run: 'run', read_file: 'read', list_files: 'look', git: 'git', github: 'github', diagnostics: 'check'};
function nowKind(l) {
  if (l.phase === 'thinking') return 'thinking';
  if (l.phase === 'writing') return 'writing';
  const k = TOOL_KIND[l.tool] || 'run';
  return k === 'run' && /unittest|pytest|\btest/i.test(l.target || '') ? 'test' : k;
}
function toolParts(preview, tool) {   // "Wrote" + "main.py" + "2 lines"
  const first = String(preview || '').split('\n')[0];
  const w = /^write (\S+)(?: \((\d+) lines?\))?/.exec(first); if (w) return [DONE_VERB.write_file, w[1], w[2] ? w[2] + ' lines' : ''];
  const e = /^edit (\S+)/.exec(first); if (e) return [DONE_VERB.edit_file, e[1], ''];
  const m = /^(\w+) (\{.*\})$/.exec(first);
  if (m) { try { const a = JSON.parse(m[2]); const arg = a.path || a.command || a.args || a.action || ''; return [DONE_VERB[m[1]] || m[1], String(arg), '']; } catch (x) { /* fall through */ } }
  return [DONE_VERB[tool] || tool || '', first.length > 90 ? first.slice(0, 90) + '...' : first, ''];
}
function diffNode(preview) {
  const lines = String(preview || '').split('\n').slice(1); if (!lines.length) return null;
  return el('div', {class: 'cc-diff'}, ...lines.map((l) => el('div', {class: /^\s*\+ /.test(l) ? 'add' : /^\s*- /.test(l) ? 'del' : 'hdr'}, l.replace(/^(\s*)([+-]) /, '$2 '))));
}
function cEvent(e) {
  const feed = $('codeIn');
  if (e.kind === 'user') { feed.append(el('div', {class: 'cc-user'}, el('span', {class: 'ember'}), el('span', {}, e.text))); C.last = null; return; }
  if (e.kind === 'start') { feed.replaceChildren(el('div', {class: 'cc-user'}, el('span', {class: 'ember'}), el('span', {}, e.task))); C.last = null; return; }
  if (e.kind === 'step') {
    const prose = String(e.raw || '').split(/<\|tool_call\|>|<tool_call>/)[0].trim();
    if (e.tool === 'finish') { if (prose) feed.append(el('div', {class: 'cc-say'}, prose)); C.last = null; return; }
    if (!e.tool) { feed.append(el('div', {class: 'cc-say'}, e.preview)); C.last = null; return; }
    if (prose) feed.append(el('div', {class: 'cc-say'}, prose));
    const [name, arg, extra] = toolParts(e.preview, e.tool);
    const node = el('div', {class: 'cc-tool run'}, el('div', {class: 'cc-head'}, el('span', {class: 'cc-verb'}, name),
      el('span', {class: 'cc-arg'}, arg ? arg + (extra ? '  \u00b7  ' + extra : '') : '')));
    const d = (e.tool === 'write_file' || e.tool === 'edit_file') ? diffNode(e.preview) : null; if (d) node.append(d);
    feed.append(node); C.last = node; return;
  }
  if (e.kind === 'result') {
    if (C.last) {
      const t = String(e.text || ''), bad = /^error|exit code [1-9]|Traceback|FAILED/m.test(t), lines = t.split('\n').filter((x) => x.trim());
      C.last.classList.remove('run'); C.last.classList.add(bad ? 'no' : 'ok');
      const head = (lines[0] || 'Done').slice(0, 200) + (lines.length > 1 ? '  (+' + (lines.length - 1) + ' lines)' : '');
      const res = el('div', {class: 'cc-res', title: 'Tap to show the whole output'}, el('span', {class: 'arrow'}, '\u2192'), el('span', {class: 'txt'}, head));
      const node = C.last; res.onclick = () => node.classList.toggle('open');
      node.append(res); if (lines.length > 1) node.append(el('div', {class: 'cc-more'}, t)); C.last = null;
    }
    return;
  }
  if (e.kind === 'answer') { const q = document.getElementById('ask' + e.id); if (q) q.remove(); return; }
  if (e.kind === 'ask') {
    const reply = (allow, always) => post('/api/code/sessions/' + C.sid + '/answer', {id: e.id, allow, always}).then(() => poll());
    const node = el('div', {class: 'cc-ask', id: 'ask' + e.id}, el('div', {class: 'q'}, 'Allow this?'), el('pre', {}, e.preview),
      el('div', {class: 'row'}, el('button', {class: 'btn small', onclick: () => reply(true, false)}, 'Yes'), el('button', {class: 'chip', onclick: () => reply(true, true)}, 'Yes, and don\'t ask again for this'),
        el('button', {class: 'chip', onclick: () => reply(false, false)}, 'No')));
    feed.append(node); return;
  }
  if (e.kind === 'end') {
    if (e.finished || e.said) {                       // the model talking to the person: what it did, what to run, what it suggests
      if (e.finished) setTimeout(() => { if (!$('codePv').hidden) reloadPreview(); else if (!$('codePreviewBtn').disabled) $('codePreviewBtn').classList.add('pulse'); }, 700);     // the page changed: refresh it, or point at Preview
      feed.append(renderMessage(e.summary || 'Done.', e.finished));
      if (e.next && e.next.length) feed.append(el('div', {class: 'cc-next'}, el('span', {class: 'lead'}, 'Suggested next:'),
        ...e.next.map((t) => el('button', {class: 'chip', onclick: () => { $('codeTask').value = t; $('codeGo').click(); }}, t))));
      return;
    }
    const cls = e.error || e.limited ? 'bad' : 'stop';
    feed.append(el('div', {class: 'cc-end ' + cls}, el('span', {class: 'mark'}, e.error || e.limited ? '\u2717' : '\u25a0'),
      el('span', {}, /^(Stopped|Paused)/i.test(e.summary || '') ? e.summary : (e.error ? 'Could not finish: ' : e.limited ? 'Paused: ' : 'Stopped: ') + (e.summary || (e.turns + ' steps used')))));
  }
}
// a message from the model: paragraphs, `inline code`, and fenced blocks (commands to run) with a Copy button
function renderMessage(text, good) {
  const box = el('div', {class: 'cc-msg' + (good ? ' good' : '')});
  const parts = String(text).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 0) {
      part.split(/\n{2,}/).map((x) => x.trim()).filter(Boolean).forEach((para) => {
        const p = el('p', {}); para.split(/(`[^`\n]+`)/).forEach((bit) => p.append(bit.length > 2 && bit[0] === '`' && bit.endsWith('`') ? el('code', {class: 'in'}, bit.slice(1, -1)) : document.createTextNode(bit)));
        box.append(p);
      });
    } else {
      const nl = part.indexOf('\n'), first = nl >= 0 ? part.slice(0, nl).trim() : '', lang = /^[A-Za-z0-9_+-]{1,14}$/.test(first) ? first : '';
      const code = (lang || nl < 0 ? part.slice(nl + 1) : part).replace(/^\n|\n$/g, '');
      const btn = el('button', {class: 'copy', onclick: async () => { try { await navigator.clipboard.writeText(code); btn.textContent = 'Copied'; } catch (x) { btn.textContent = 'Select and copy'; } setTimeout(() => { btn.textContent = 'Copy'; }, 1500); }}, 'Copy');
      box.append(el('div', {class: 'cc-block'}, el('div', {class: 'bh'}, el('span', {}, lang || 'run this'), btn), el('pre', {}, code)));
    }
  });
  return box;
}
// the live "working" line: our ember mark pulsing, a word for what it is doing (it changes every few seconds), the file or command, seconds, and the text as it is written
function renderLive(live, state) {
  let n = document.getElementById('codeLive');
  if (!live || state === 'asking' || !['starting', 'working'].includes(state)) { if (n) n.remove(); C.liveAt = null; return; }
  if (!n) { n = el('div', {class: 'cc-live', id: 'codeLive'}, el('div', {class: 'l1'}, el('span', {class: 'mark'}, logo(20, false, 'brand')), el('span', {class: 'what'}), el('span', {class: 'meta'})), el('div', {class: 'prose'})); }
  $('codeIn').append(n);     // always the last thing in the feed
  C.live = live; C.liveAt = performance.now() - live.secs * 1000;
  paintLive();
}
function paintLive() {
  const n = document.getElementById('codeLive'); if (!n || !C.live || C.liveAt == null) return;
  const l = C.live, secs = Math.max(0, Math.round((performance.now() - C.liveAt) / 1000));
  const kind = nowKind(l), words = NOW_WORDS[kind] || NOW_WORDS.thinking;
  const word = C.stopping ? 'Stopping' : words[Math.floor(secs / 3) % words.length];
  const what = n.querySelector('.what');
  if (what.textContent !== word + '\u2026') { what.classList.add('swap'); setTimeout(() => { what.textContent = word + '\u2026'; what.classList.remove('swap'); }, 120); }
  const target = (l.target || '').split('\n')[0].slice(0, 60);
  n.querySelector('.meta').textContent = (target ? target + '  \u00b7  ' : '') + secs + 's' + (l.tokens ? '  \u00b7  ' + fmt(l.tokens) + ' words' : '');
  n.querySelector('.prose').textContent = l.text || '';
  const f = $('codeFeed'); if (f.scrollTop + f.clientHeight > f.scrollHeight - 160) scrollCode();
}
setInterval(() => { if (C && C.liveAt != null) paintLive(); }, 160);
async function poll() {
  clearTimeout(C.timer); if (!C.sid || !cOn()) return;
  const r = await api('/api/code/sessions/' + C.sid + '?after=' + C.seen);
  if (!r.ok) { C.sid = null; return; }
  const j = await r.json(), feed = $('codeFeed'), atEnd = feed.scrollTop + feed.clientHeight > feed.scrollHeight - 120;
  const old = document.getElementById('codeLive'); if (old) old.remove();      // the live line sits below the newest step, so take it out while steps are added
  for (const e of j.events) cEvent(e); C.seen += j.events.length;
  if (j.events.some((e) => e.kind === 'result' || e.kind === 'end')) refreshFiles();
  renderLive(j.live, j.state);
  if (j.events.length && atEnd) scrollCode();
  showUsage(j.usage);
  const live = ['starting', 'working', 'asking'].includes(j.state);
  $('codeGo').hidden = live; $('codeStop').hidden = !live; if (!live) { C.stopping = false; $('codeStop').disabled = false; }
  if (live) C.timer = setTimeout(poll, j.state === 'asking' ? 1500 : 350);

$('codeGo').onclick = async () => {
  const task = $('codeTask').value.trim(); if (!task || !C.model) return;
  if (C.sid && C.chatKey === C.project + '|' + C.model) {         // a conversation is going in this project with this model: this is its next message
    const r = await post('/api/code/sessions/' + C.sid + '/message', {text: task}); const j = await r.json().catch(() => ({}));
    if (r.ok) { C.stopping = false; $('codeStop').disabled = false; $('codeTask').value = ''; poll(); return; }
    if (r.status !== 404 && r.status !== 400) { note('bad', 'Could not send', (j.message || '') + ' ' + (j.action || '')); return; }
    if (r.status === 400 && /still working/i.test(j.message || '')) { note('bad', 'Still working', 'Press Stop first, or wait for it to finish.'); return; }
  }
  const r = await post('/api/code/start', {project: C.project, task, model: C.model, auto_edits: C.auto}); const j = await r.json();
  if (!r.ok) { note('bad', 'Could not start', j.message + ' ' + (j.action || '')); return; }
  C.sid = j.id; C.chatKey = C.project + '|' + C.model; C.seen = 0; C.stopping = false; $('codeStop').disabled = false; $('codeTask').value = ''; $('codeIn').replaceChildren(); poll();
};
// ---------------------------------------------------------------- live preview of what was built (the page's own errors come back here)
const PV = {url: null, errors: [], loaded: false, size: 'phone', entry: ''};
function setPvSize(sz) { PV.size = sz; $('pvStage').dataset.size = sz; document.querySelectorAll('#codePv .pvbar [data-size]').forEach((b) => b.classList.toggle('on', b.dataset.size === sz)); }
function paintPv() {
  const foot = $('pvFoot'); foot.replaceChildren();
  if (PV.errors.length) {
    foot.append(el('div', {class: 'bad'}, PV.errors.length + (PV.errors.length === 1 ? ' problem' : ' problems') + ' found in ' + PV.entry),
      el('ul', {}, ...PV.errors.slice(0, 6).map((m) => el('li', {}, m))),
      el('div', {class: 'row'}, el('button', {class: 'btn small', onclick: fixPreviewErrors}, 'Ask VryxCode to fix these')));
  } else foot.append(el('div', {class: PV.loaded ? 'good' : ''}, PV.loaded ? '✓ Loaded with no errors found' : 'Loading…'));
}
async function openPreview() {
  if (!C.project) return;
  const r = await post('/api/code/preview', {project: C.project}); const j = await r.json().catch(() => ({}));
  if (!r.ok) { note('bad', 'Preview', (j.message || 'Could not open the preview.') + ' ' + (j.action || '')); return; }
  if (!j.entry) { note('fin', 'Nothing to preview yet', 'Ask VryxCode to build a web page (an .html file) and it can be previewed here.'); return; }
  $('codePreviewBtn').classList.remove('pulse');
  PV.url = j.url; PV.entry = j.entry; PV.errors = []; PV.loaded = false; setPvSize(PV.size); paintPv();
  $('codePv').hidden = false; $('pvFrame').src = j.url;
}
function reloadPreview() { if (!PV.url) return; PV.errors = []; PV.loaded = false; paintPv(); $('pvFrame').src = PV.url; }
function fixPreviewErrors() {
  const list = PV.errors.slice(0, 6).map((m) => '- ' + m).join('\n');
  $('codePv').hidden = true;
  $('codeTask').value = 'The preview of ' + PV.entry + ' shows these problems:\n' + list + '\nPlease fix them.';
  $('codeGo').click();
}
window.addEventListener('message', (e) => {
  const f = $('pvFrame'); if (!f || e.source !== f.contentWindow) return;
  const d = e.data || {}; if (!d.vryxPreview) return;
  if (d.loaded) { PV.loaded = true; paintPv(); return; }
  if (typeof d.msg === 'string' && PV.errors.length < 10 && !PV.errors.includes(d.msg)) { PV.errors.push(d.msg); paintPv(); }
});
$('codePreviewBtn').onclick = openPreview; $('pvBack').onclick = () => { $('codePv').hidden = true; }; $('pvReload').onclick = reloadPreview;
document.querySelectorAll('#codePv .pvbar [data-size]').forEach((b) => { b.onclick = () => setPvSize(b.dataset.size); });
$('codeStop').onclick = () => { if (!C.sid || C.stopping) return; C.stopping = true; $('codeStop').disabled = true; paintLive(); post('/api/code/sessions/' + C.sid + '/stop').then(() => poll()); };
$('codeTask').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('codeGo').click(); } });
const b64 = (buf) => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
async function sendImport(body) {
  const r = await post('/api/code/import', Object.assign({project: C.project}, body)); const j = await r.json();
  note(r.ok ? 'fin' : 'bad', r.ok ? 'Imported' : 'Not imported', r.ok ? j.imported + ' files added to ' + C.project + '.' : j.message + ' ' + (j.action || ''));
  refreshFiles();
}
function openImport() {
  const m = dialog([el('h2', {}, 'Import into ' + C.project), el('div', {style: 'color:var(--muted)'}, 'Add an existing project: a zip file, or a whole folder (up to 1,000 files and 20 MB; .git and node_modules are skipped). Files with the same name are replaced.'),
    el('button', {class: 'btn', onclick: () => { m.remove(); $('codeZipIn').click(); }}, 'Choose a zip file'),
    el('button', {class: 'btn ghost', onclick: () => { m.remove(); $('codeDirIn').click(); }}, 'Choose a folder')], 'Cancel');
}
$('codeZipIn').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) await sendImport({zip_b64: b64(await f.arrayBuffer())}); };
$('codeDirIn').onchange = async (e) => {
  const list = Array.from(e.target.files).filter((f) => !/(^|\/)(\.git|node_modules|__pycache__)\//.test(f.webkitRelativePath)); e.target.value = '';
  if (!list.length) return;
  const files = []; for (const f of list) { const p = f.webkitRelativePath.split('/').slice(1).join('/'); if (p) files.push({path: p, b64: b64(await f.arrayBuffer())}); }
  await sendImport({files});

// ---------------------------------------------------------------- login
function showLogin() { if (location.search.includes('notice=keylink')) { $('loginErr').textContent = 'Key links are turned off (a key in an address is easy to leak). Paste your key below, or ask the owner for a one-time sign-in link.'; history.replaceState(null, '', '/'); } offerEmailSignIn(); S.state = null; applyTheme(); $('login').hidden = false; $('app').hidden = true; $('loginBrand').replaceChildren(logo(32, false, 'brand'), 'Emvryx'); }
async function offerEmailSignIn() {
  document.querySelectorAll('#emailOpt').forEach((n) => n.remove());
  try { const o = await (await fetch('/api/auth-options')).json(); if (!o.email) return; } catch (e) { return; }
  $('loginForm').append(el('button', {class: 'btn ghost', type: 'button', id: 'emailOpt', onclick: emailSignIn}, 'Sign in with an email code instead'));
}
function emailSignIn() {
  const email = el('input', {type: 'text', placeholder: 'you@example.com', autocomplete: 'email', 'aria-label': 'Email address', inputmode: 'email'}), code = el('input', {type: 'text', placeholder: '6-digit code', inputmode: 'numeric', 'aria-label': 'Code', hidden: true, autocomplete: 'one-time-code'});
  const out = el('div', {style: 'color:var(--muted);font-size:14px'}); let step = 1;

}
$('loginForm').onsubmit = async (e) => {

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
