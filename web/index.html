<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emvryx</title>
<meta name="theme-color" content="#07080D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emvryx">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg:#07080D; --side:#0A0B11; --surface:#0F1119; --surface2:#161926; --line:#232739; --text:#EEF0F6; --muted:#9AA3BC;
  --accent:#F5A524; --onaccent:#1A1204; --accenttext:#F5A524; --sun:#F5A524; --core:#FFD27A; --glow:rgba(245,165,36,.14);   /* brand amber until a model's colours apply */
  --danger:#E5484D;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 'DM Sans', system-ui, sans-serif; overflow: hidden;
  background-image: radial-gradient(900px 420px at 62% -10%, var(--glow), transparent 70%); }
body, .tx { transition: background-color .6s ease, color .6s ease; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg .core { fill: var(--core); stroke: var(--sun); stroke-width: 3; transition: fill .6s, stroke .6s; }
.app { display: flex; height: 100%; height: calc(100dvh / var(--z, 1)); zoom: var(--z, 1); }   /* --z is the person's text size (Settings > Look) */
/* sidebar (always on wide screens, a drawer on phones) */
.side { position: relative; width: 288px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 20px 8px; font: 600 20px 'Sora', sans-serif; letter-spacing: -0.02em; }
.newchat { margin: 12px 14px 6px; background: var(--accent); color: var(--onaccent); border: 0; border-radius: 14px; min-height: 46px; font-weight: 600; }
.chats { flex: 1; overflow-y: auto; padding: 4px 14px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--muted); opacity: .8; padding: 14px 6px 2px; }
.row { display: flex; align-items: center; border-radius: 12px; }
.row.cur { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
.row button.open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 8px 12px; min-height: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row button.del { background: transparent; border: 0; color: var(--muted); width: 40px; height: 44px; opacity: 0; }
.row:hover button.del, .row:focus-within button.del { opacity: 1; }
.row button.more { background: transparent; border: 0; color: var(--muted); width: 36px; height: 44px; opacity: 0; font-size: 18px; }
.row:hover button.more, .row:focus-within button.more { opacity: 1; }
@media (hover: none) { .row button.more { opacity: .7; } .row button.del { display: none; } }
.chatsearch { padding: 0 14px 6px; position: relative; } .chatsearch input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--text); padding: 8px 12px 8px 34px; font: inherit; font-size: 15px; min-height: 40px; }
.chatsearch svg { position: absolute; left: 24px; top: 10px; color: var(--muted); }
.hit { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 8px 12px; } .hit:hover { background: var(--surface2); } .hit small { display: block; color: var(--muted); font-size: 13px; white-space: normal; }
.kinds { display: flex; flex-wrap: wrap; gap: 8px; } .kinds button.on { border-color: var(--accent); color: var(--accenttext); }
.links { border-top: 1px solid var(--line); padding: 8px 14px; }
.link { display: flex; width: 100%; align-items: center; gap: 12px; background: transparent; border: 0; border-radius: 12px; padding: 0 12px; min-height: 40px; text-align: left; font-weight: 500; }
.link:hover:not([disabled]) { background: var(--surface2); }
.link svg { flex-shrink: 0; color: var(--muted); }
.link small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.account { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 12px 16px; text-align: left; border-radius: 0; }
.account:hover { background: var(--surface2); }
.account .chev { margin-left: auto; color: var(--muted); }
.acctmenu { position: absolute; left: 12px; right: 12px; bottom: 70px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 5; }
.acctmenu[hidden] { display: none; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--accent); color: var(--onaccent); display: grid; place-items: center; font-weight: 700; }
.scrim { display: none; }
/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.top { height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--line); }
.top .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
.icon { background: transparent; border: 0; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
.icon:hover { background: var(--surface2); }
.hamburger { display: none; }
.banner { background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 8px 16px; text-align: center; }
.banner b { color: var(--accenttext); font-weight: 600; }
.scroll { flex: 1; overflow-y: auto; scroll-behavior: auto; padding: 24px 16px 8px; }
.thread { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; }
.msg { display: flex; flex-direction: column; gap: 6px; animation: rise .35s ease both; }
.msg:not(:nth-last-child(-n+2)) { animation: none; }   /* only the newest messages slide in: a long chat does not replay every message each time it is drawn */
.msg.user { align-self: flex-end; max-width: 80%; }
.msg.user .bubble { background: var(--surface2); border-radius: 18px 18px 4px 18px; padding: 12px 16px; }
.msg.ai { align-self: flex-start; max-width: 94%; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; padding: 14px 18px; }
.bubble { white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; min-height: 36px; font-size: 14px; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.note { align-self: center; color: var(--muted); font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; }
.cursor { display: inline-block; width: .55em; color: var(--accenttext); animation: blink 1s steps(2) infinite; }
.thinking { align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 6px 4px; animation: rise .3s ease both; }
.thinking svg { overflow: visible; animation: hop 1.1s ease-in-out infinite; }
.thinking .word { font-weight: 500; animation: rise .35s ease both; }
.thinking .secs { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 3.4em; }
.thinking .dots span { animation: dot 1.2s infinite; display: inline-block; }
.thinking .dots span:nth-child(2) { animation-delay: .2s; }
.thinking .dots span:nth-child(3) { animation-delay: .4s; }
.err { align-self: stretch; background: var(--surface); border: 1px solid var(--danger); border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.err b { color: var(--danger); }
.empty { text-align: center; color: var(--muted); margin: auto; padding: 40px 0; }
.empty h1 { font: 600 32px 'Sora', sans-serif; color: var(--text); margin: 12px 0 6px; letter-spacing: -0.02em; }
.down { position: absolute; right: 24px; bottom: 170px; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; width: 44px; height: 44px; display: none; place-items: center; z-index: 5; }
.down.show { display: grid; }
/* composer */
.composer { flex-shrink: 0; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
.box { max-width: 760px; margin: 0 auto; position: relative; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 10px 10px 16px; display: flex; flex-direction: column; gap: 10px; }
.attached { display: flex; flex-wrap: wrap; gap: 6px; } .attached[hidden] { display: none; }
.attached .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; padding: 4px 10px; }
.attached .chip.pic { padding: 4px; border-radius: 14px; } .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; display: block; } .msg .pics { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; justify-content: flex-end; } .msg .pics img { max-width: 220px; max-height: 220px; border-radius: 14px; display: block; cursor: zoom-in; } .msg .pics .chip { min-height: 30px; padding: 2px 10px; }
.attached .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52vw; }
.card textarea { width: 100%; background: transparent; border: 0; outline: none; resize: none; color: var(--text); font: inherit; max-height: 160px; padding: 0; }
/* the message box is a rich text box (not a textarea) so the phone keyboard offers a fresh screenshot to paste, like other chat apps; it only ever holds plain text */
.card .ce { width: 100%; min-height: 1.5em; max-height: 160px; overflow-y: auto; outline: none; color: var(--text); font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.card .ce:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
@media (pointer: coarse) { .card .ce { font-size: 16px; } }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tools .left { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
/* the memory meter (feature flag context_meter): a ring that fills as the model's memory fills; red near the point where older messages get summarized */
.ctx { --c: var(--accent); width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; flex-shrink: 0; font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer;
  background: radial-gradient(var(--surface) 57%, transparent 59%), conic-gradient(var(--c) calc(var(--p, 0) * 1%), var(--line) 0); }
.ctx.near { --c: var(--danger); color: var(--danger); } .ctx.busy { animation: ctxPulse 1.2s ease-in-out infinite; }
@keyframes ctxPulse { 50% { opacity: .45; } } @media (prefers-reduced-motion: reduce) { .ctx.busy { animation: none; } }
.ctxbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 12px; } .ctxbar > div { height: 100%; background: var(--accent); }
.ctxrow { display: flex; justify-content: space-between; gap: 12px; padding: 4px 12px; font-size: 14px; } .ctxrow span:last-child { color: var(--muted); }
.pill { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; min-height: 44px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.pill.plain { background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; }
.send { background: var(--accent); color: var(--onaccent); border: 0; border-radius: 12px; width: 44px; height: 44px; font-size: 20px; font-weight: 700; flex-shrink: 0; }
.send[disabled] { opacity: .45; cursor: default; }
.send.stop { background: var(--surface2); color: var(--text); border: 1px solid var(--line); }
.menu { position: absolute; left: 0; bottom: 100%; margin-bottom: 10px; width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 20; animation: rise .2s ease both; }
.regen { align-self: stretch; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; animation: rise .2s ease both; }
.regen .head { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--muted); padding: 4px 6px; }
#modelMenu, #effortMenu, #ctxMenu { max-height: min(72vh, calc(100dvh - 190px)); overflow-y: auto; overscroll-behavior: contain; } #modelMenu > *, #effortMenu > *, #ctxMenu > * { flex-shrink: 0; }   /* rows keep their height and the list scrolls (they were squashed on top of each other) */   /* a long list scrolls instead of running off the top of the screen */
.menu .head { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--muted); padding: 4px 6px; }
.opt { text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-height: 44px; display: flex; align-items: center; gap: 12px; }
.opt.sel { border-color: var(--accent); }
.opt[disabled] { opacity: .5; cursor: default; }
.opt .grow { flex: 1; min-width: 0; } .opt > small { flex: 0 0 auto; max-width: 36%; font-size: 13px; } .opt small { color: var(--muted); display: block; font-size: 14px; }
.usage { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 0; position: relative; }
.usage button { background: transparent; border: 0; color: var(--muted); font-size: 13px; padding: 0; }
.bar { width: 220px; max-width: 70%; height: 5px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s linear; }
.usage.low .bar > div { background: var(--danger); } .usage.low button { color: var(--danger); }
.pop { position: absolute; right: 8px; top: -8px; font-size: 13px; font-weight: 600; color: var(--accenttext); animation: floatup 1.3s ease-out both; pointer-events: none; }
/* VryxCode screen */
.code { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.code[hidden] { display: none; }
.code .top2 { height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; }
.code .top2 .title { font: 600 18px 'Sora', sans-serif; flex: 1; white-space: nowrap; padding-left: 4px; }
.code .top2 .chip.plus { padding: 4px 11px; font-size: 18px; line-height: 1; font-weight: 600; color: var(--accenttext); }
.code .top2 .chip { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 11px; font-size: 13px; flex-shrink: 0; } .code .top2 #codeProj { flex-shrink: 1; min-width: 0; max-width: 26vw; }
.code .main2 { flex: 1; min-height: 0; display: flex; position: relative; }
.code .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.code .feed { flex: 1; overflow-y: auto; padding: 8px 16px 12px; }
.code .feedin { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
.code pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
.code .you { align-self: flex-end; max-width: 85%; background: var(--surface2); border-radius: 18px 18px 4px 18px; padding: 10px 14px; }
.code details.step { border-radius: 12px; }
.code details.step summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; color: var(--muted); font-size: 15px; min-height: 40px; }
.code details.step summary::-webkit-details-marker { display: none; }
.code details.step summary:hover { background: var(--surface); }
.code details.step .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); flex-shrink: 0; }
.code details.step.ok .dot { background: var(--accent); } .code details.step.no .dot { background: var(--danger); }
.code details.step .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.code details.step .more { padding: 4px 10px 10px 28px; display: flex; flex-direction: column; gap: 8px; }
.code details.step .more pre { color: var(--muted); max-height: 240px; overflow: auto; }
.code .ask, .code .fin, .code .bad { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.code .ask { border-color: var(--accent); } .code .bad { border-color: var(--danger); }
.code .ask b, .code .fin b { font-weight: 600; } .code .bad b { color: var(--danger); }
.code .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.code .small { min-height: 40px; padding: 0 16px; border-radius: 12px; font-weight: 600; }
.code .empty { margin: auto 0; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding-bottom: 8vh; }
.code .empty h1 { margin: 0; font: 600 30px 'Sora', sans-serif; letter-spacing: -0.02em; }
.code .empty p { margin: 0; color: var(--muted); max-width: 460px; }
.code .tip { color: var(--muted); font-size: 13px; text-align: center; padding: 6px 0 0; }
.code .menu { bottom: auto; top: 100%; left: auto; right: 0; margin: 6px 0 0; width: min(320px, 92vw); z-index: 5; }
.code .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 4; box-shadow: -12px 0 32px rgba(0,0,0,.25); }
.code .drawer[hidden] { display: none; }
.code .drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 16px; font-weight: 600; }
.code .flist { max-height: 38%; overflow-y: auto; padding: 0 8px 8px; }
.code .flist button { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 8px; font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 36px; }
.code .flist button:hover, .code .flist button.on { background: var(--surface2); }
.code .viewer { flex: 1; overflow: auto; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
/* VryxCode: a work log in Emvryx's own style: an ember mark for you, plain words from the model, one card per action with a coloured edge, a living "working" line */
.code .feedin { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 14px; line-height: 1.55; gap: 6px; }
.code .cc-user { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0 14px; margin-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--text); white-space: pre-wrap; word-break: break-word; }
.code .cc-user .ember { flex-shrink: 0; width: 10px; height: 10px; margin-top: 6px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.code .cc-say { color: var(--text); white-space: pre-wrap; word-break: break-word; padding: 4px 0 2px; }
.code .cc-tool { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 6px 12px; border-left: 3px solid var(--line); background: var(--surface); border-radius: 4px 12px 12px 4px; }
.code .cc-tool.run { border-left-color: var(--accent); } .code .cc-tool.ok { border-left-color: #3fb950; } .code .cc-tool.no { border-left-color: var(--danger); }
.code .cc-head { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.code .cc-verb { font-weight: 700; flex-shrink: 0; }
.code .cc-arg { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code .cc-tool.run .cc-verb { animation: ccglow 1.4s ease-in-out infinite; }
.code .cc-res, .code .cc-diff, .code .cc-more { padding-left: 2px; }
.code .cc-res { color: var(--muted); display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.code .cc-res .arrow { flex-shrink: 0; } .code .cc-res .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code .cc-tool.open .cc-res .txt { white-space: pre-wrap; word-break: break-word; }
.code .cc-diff { margin-top: 4px; border-radius: 8px; overflow: hidden; }
.code .cc-diff div { white-space: pre-wrap; word-break: break-word; padding: 0 8px; }
.code .cc-diff .add { color: #3fb950; background: rgba(63,185,80,.12); } .code .cc-diff .del { color: #f85149; background: rgba(248,81,73,.12); } .code .cc-diff .hdr { color: var(--muted); }
.code .cc-more { color: var(--muted); max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; display: none; }
.code .cc-tool.open .cc-more { display: block; }
.code .cc-tool.no .cc-diff { opacity: .45; }
.code .cc-live { display: flex; flex-direction: column; gap: 4px; padding: 10px 0 2px; }
.code .cc-live .l1 { display: flex; gap: 10px; align-items: center; color: var(--accenttext); }
.code .cc-live .mark { display: inline-flex; animation: ccpulse 1.2s ease-in-out infinite; }
.code .cc-live .what { transition: opacity .25s; } .code .cc-live .what.swap { opacity: 0; }
.code .cc-live .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.code .cc-live .prose { color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 7.5em; overflow: hidden; padding-left: 30px; }

@media (max-width: 760px) {

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
/* iPhone installed app (full screen, translucent status bar): keep everything clear of the notch and the home bar, and stop iOS zooming in on small text boxes */
:root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.top { box-sizing: border-box; height: calc(60px + var(--sat)); padding-top: var(--sat); padding-left: calc(12px + var(--sal)); padding-right: calc(12px + var(--sar)); }
.side { padding-top: var(--sat); }
.account { padding-bottom: calc(12px + var(--sab)); }
.code, .auth, .sx, .adm { box-sizing: border-box; padding-top: var(--sat); padding-bottom: var(--sab); }
.modal { padding-top: calc(16px + var(--sat)); padding-bottom: calc(16px + var(--sab)); }
.sx-toast { bottom: calc(24px + var(--sab)) !important; }
.composer { padding-bottom: calc(max(var(--sab) - 22px, 0px) + 8px); }   /* the home indicator is a thin line at the very bottom: sit close to it instead of leaving the whole safe area empty */

/* Admin screen (owner and admins): Previews, People, Sign-ups, Activity */
.adm { position: fixed; inset: 0; z-index: 46; background: var(--bg); display: flex; flex-direction: column; box-sizing: border-box; padding-top: var(--sat); padding-bottom: var(--sab); }
.adm-top { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, calc((100% - 760px) / 2)) 4px; }
.adm-top h2 { margin: 0; font: 600 22px 'Sora', sans-serif; flex: 1; }
.adm-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px max(16px, calc((100% - 760px) / 2)) 10px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.adm-tabs button { flex-shrink: 0; background: transparent; border: 0; border-radius: 999px; padding: 0 18px; min-height: 42px; font-weight: 600; color: var(--muted); }
.adm-tabs button.on { background: var(--accent); color: var(--onaccent); }
.adm-body { flex: 1; overflow-y: auto; padding: 18px max(16px, calc((100% - 760px) / 2)) 80px; display: flex; flex-direction: column; gap: 16px; }
.adm-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.adm-card h3 { margin: 0; font: 600 20px 'Sora', sans-serif; }
.adm-card p { margin: 0; color: var(--muted); }
.adm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.adm-sub { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.adm-sub b { font-size: 17px; } .adm-sub small { color: var(--muted); font-size: 14px; line-height: 1.4; }
.adm-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.adm-tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.adm-tag.on { border-color: var(--accent); color: var(--accenttext); }
.adm-person { display: grid; grid-template-columns: 44px 1fr; gap: 6px 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.adm-person:first-of-type { border-top: 0; }
.adm-av { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: var(--surface2); color: var(--accenttext); }
.adm-person .adm-acts { grid-column: 1 / -1; }
.adm-person small { color: var(--muted); font-size: 14px; word-break: break-word; }
.adm-search { width: 100%; box-sizing: border-box; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; color: var(--text); padding: 12px 14px; font: inherit; min-height: 46px; }
.usage { padding-top: 6px; gap: 4px; }
/* Safari / iPhone only: in the installed app the "dynamic viewport" height can come out shorter than the screen, which leaves an empty band under the message box. Fill the real screen instead. */
@supports (-webkit-touch-callout: none) {
  html, body { height: var(--appH, 100%); }
  body { position: fixed; inset: 0; width: 100%; height: var(--appH, 100%); overflow: hidden; }
  .app { height: calc(var(--appH, 100%) / var(--z, 1)); }
}
@media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }   /* under 16px iOS zooms the page in when a box is tapped, and does not zoom back out */

/* welcome tour */
.tour { position: fixed; inset: 0; z-index: 80; background: #05060b; color: #eef0f6; display: flex; flex-direction: column; overflow: hidden; padding-top: var(--sat); padding-bottom: var(--sab); animation: tourin .5s ease both; }
@keyframes tourin { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
.tour .glow { position: absolute; inset: -25%; background: radial-gradient(38% 32% at 24% 22%, rgba(255,92,35,.38), transparent 70%), radial-gradient(34% 30% at 82% 78%, rgba(245,165,36,.30), transparent 70%), radial-gradient(30% 30% at 74% 14%, rgba(120,90,255,.24), transparent 70%); animation: tourdrift 12s ease-in-out infinite alternate; }
@keyframes tourdrift { to { transform: translate3d(5%, -4%, 0) scale(1.1) rotate(4deg); } }
.tour .skip { position: absolute; top: calc(14px + var(--sat)); right: 16px; z-index: 3; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #cfd5ea; border-radius: 999px; padding: 8px 16px; font-weight: 600; min-height: 40px; }
.tour .stage { position: relative; flex: 1; z-index: 2; }
.tour .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 56px 26px 12px; text-align: center; opacity: 0; transform: translateX(46px); transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.tour .slide.on { opacity: 1; transform: none; pointer-events: auto; } .tour .slide.past { transform: translateX(-46px); }
.tour h2 { margin: 6px 0 0; font: 700 34px/1.08 'Sora', sans-serif; letter-spacing: -0.02em; background: linear-gradient(180deg, #fff, #c9cfe6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tour p { margin: 0; max-width: 430px; color: #aab2cc; font-size: 18px; line-height: 1.5; }
.tour .kicker { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #ffb27a; margin-top: 4px; }
.tour .art { position: relative; width: 100%; max-width: 380px; min-height: 200px; display: flex; align-items: center; justify-content: center; }
.tour .slide.on .rise { animation: tourrise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
@keyframes tourrise { from { opacity: 0; transform: translateY(22px) scale(.96); } to { opacity: 1; transform: none; } }
.tour .rings i { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,140,60,.5); animation: tourring 3.2s ease-out infinite; }
.tour .rings i:nth-child(2) { animation-delay: 1.05s; } .tour .rings i:nth-child(3) { animation-delay: 2.1s; }
@keyframes tourring { from { transform: scale(.7); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }
.tour .mcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.tour .mcard { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; padding: 14px 14px; text-align: left; backdrop-filter: blur(6px); }
.tour .mcard b { display: block; font: 600 20px 'Sora', sans-serif; } .tour .mcard span { color: #aab2cc; font-size: 14px; }
.tour .bubble2 { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; padding: 12px 16px; text-align: left; font-size: 16px; max-width: 300px; }
.tour .bubble2.me { background: rgba(255,92,35,.9); color: #1a0d05; border: 0; align-self: flex-end; font-weight: 600; }
.tour .chat { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: flex-start; }
.tour .src { display: inline-block; margin-top: 8px; font-size: 13px; color: #ffb27a; border: 1px solid rgba(255,178,122,.4); border-radius: 999px; padding: 2px 10px; }
.tour .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tour .chips span { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 10px 16px; font-weight: 600; }
.tour .term { background: #0b0d16; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 14px 16px; width: 100%; text-align: left; font: 14px/1.7 ui-monospace, Menlo, Consolas, monospace; color: #cfd5ea; }
.tour .term .ok { color: #5fd38a; } .tour .term .dim { color: #7c849e; }
.tour .foot { position: relative; z-index: 3; padding: 8px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.tour .dots { display: flex; gap: 8px; } .tour .dots span { width: 8px; height: 8px; border-radius: 999px; background: #3a4056; transition: all .35s; } .tour .dots span.on { width: 28px; background: #ff5c23; }
.tour .btns { display: flex; gap: 10px; width: 100%; max-width: 430px; }
.tour .btns button { flex: 1; min-height: 52px; border-radius: 16px; font-weight: 700; font-size: 17px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07); color: #eef0f6; }
.tour .btns button.go { background: linear-gradient(135deg, #ff5c23, #f5a524); color: #1a0d05; border: 0; box-shadow: 0 10px 30px rgba(255,92,35,.35); }
.tour .btns button[hidden] { display: none; }
.tour .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffd39b; animation: tourspark 3.4s ease-in-out infinite; opacity: 0; }
@keyframes tourspark { 0% { transform: translateY(20px) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-120px) scale(1.2); opacity: 0; } }
/* features and testing */
.fchips { display: flex; flex-wrap: wrap; gap: 8px; } .fchips .pill button { background: transparent; border: 0; color: inherit; padding: 0 0 0 6px; font-size: 16px; cursor: pointer; }
body:not(.ml) .ml-ideas { display: none; }
body:not(.vxn) .vx-hero, body:not(.vxn) .vx-dots { display: none; }   /* the new VryxCode home: only with the "VryxCode update" flag (vryx.css is loaded then too) */
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Chats and settings">
    <div class="brand" id="brand"></div>
    <button class="newchat" id="newChat">+ New chat</button>
    <div class="chatsearch" id="chatSearchBox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input type="search" id="chatSearch" placeholder="Search chats" aria-label="Search chats" autocomplete="off"></div>
    <div class="chats" id="chatList"></div>
    <div class="links" id="links"></div>
    <div class="acctmenu" id="acctMenu" hidden></div>
    <button class="account" id="account" aria-haspopup="true" aria-expanded="false"><span class="avatar" id="avatar">Y</span><span style="line-height:1.25"><b id="who">Your account</b><br><small id="plan" style="color:var(--muted)"></small></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 14l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </aside>
  <button class="scrim" id="scrim" aria-label="Close menu"></button>
  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;min-width:0">
        <button class="icon hamburger" id="burger" aria-label="Open menu: chats, skills, settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span class="title" id="title">New chat</span>
      </div>
      <div style="display:flex;align-items:center">
        <button class="icon" id="themeBtn" aria-label="Switch dark or light"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        <button class="icon" id="chatMore" aria-label="More for this chat" aria-haspopup="true" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg></button>
        <button class="icon" id="newTop" aria-label="New chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="scroll" id="scroll"><div class="thread" id="thread" aria-live="polite"></div></div>
    <button class="down" id="down" aria-label="Jump to the newest message"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="composer">
      <div class="box" id="box">
        <div class="menu" id="modelMenu" hidden></div>
        <div class="menu" id="effortMenu" hidden></div>
        <div class="menu" id="attachMenu" hidden style="width:min(300px,100%)"></div>
        <div class="menu" id="ctxMenu" hidden style="width:min(340px,100%);left:auto;right:0"></div>
        <div class="card">
          <label class="sr" for="input">Message</label>
          <div class="attached" id="attached" hidden></div>
          <div id="input" class="ce" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message" data-placeholder="Message Emvryx..." enterkeyhint="send" spellcheck="true"></div>
          <div class="tools">
            <div class="left">
              <button class="pill plain" id="plus" aria-label="Add files or photos" title="Add files or photos" aria-haspopup="true" style="width:44px;justify-content:center;font-size:22px">+</button>
              <button class="pill" id="modelBtn" aria-haspopup="true" aria-label="Choose model"></button>
              <button class="pill plain" id="effortBtn" aria-haspopup="true" aria-label="Choose effort"></button>
            </div>
            <button class="ctx" id="ctxBtn" hidden aria-haspopup="true" aria-label="Memory used"></button>
            <button class="send" id="send" aria-label="Send">&uarr;</button>
          </div>
        </div>
        <div class="usage" id="usage"><span id="pop"></span><div class="bar"><div id="barFill" style="width:100%"></div></div><button id="usageBtn" aria-label="Open usage details"></button></div>
      </div>
    </div>
  </main>
</div>

<div class="code" id="code" hidden>
  <canvas class="vx-dots" id="vxDots" aria-hidden="true"></canvas>
  <div class="top2">
    <button class="icon" id="codeBack" aria-label="Back to chats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="title" id="codeTitle">Code</span>
    <div style="position:relative"><button class="chip" id="codeProj" aria-haspopup="true"></button><div class="menu" id="codeProjMenu" hidden></div></div>
    <button class="chip plus" id="codeProjNew" aria-label="New project" title="Start a new project">+</button>
    <button class="chip" id="codePreviewBtn" disabled title="See what was built, live">Preview</button>
    <button class="chip" id="codeIdeBtn" title="Editor layout: files, editor, VryxCode and preview side by side (wide screens)">Editor</button>
    <button class="chip" id="codeFilesBtn">Files</button>
  </div>
  <div class="home" id="codeHome">
    <div class="vx-hero">
      <h1>What should we <em>build</em>?</h1>
      <p>Describe it. VryxCode plans it, writes it, runs it and checks it, right here.</p>
      <div class="vx-quick"><textarea id="vxQuick" rows="2" maxlength="8000" placeholder="A bill splitter with tip, a habit tracker, a snake game..." aria-label="What should VryxCode build?"></textarea><button class="vx-go" id="vxQuickGo" type="button">Build it</button></div>
      <div class="vx-under"><div style="position:relative"><button class="vx-model" id="vxModel" type="button" aria-haspopup="true" aria-label="Choose the model"></button><div class="menu" id="vxModelMenu" hidden></div></div></div>
      <label class="vx-notify" id="vxNotifyRow" hidden><input type="checkbox" id="vxNotify"> Tell my phone when it finishes or needs me</label>
      <div class="vx-tpl" id="vxTpl" hidden><span class="lbl">Or start from a template</span><div class="vx-tpls" id="vxTpls"></div></div>
      <div class="vx-chips" id="vxChips"></div>
    </div>
    <div class="envs" id="codeEnvs"></div>
    <div class="chead"><span class="lbl">Sessions</span><div style="position:relative"><button class="chip" id="codeFilter" aria-haspopup="true">All \u25be</button><div class="menu" id="codeFilterMenu" hidden></div></div></div>
    <div class="slist" id="codeList"></div>
  </div>
  <button class="fab" id="codeNew"><span style="font-size:22px;line-height:1">+</span> New session</button>
  <div class="main2">
    <div class="ide-tree" id="ideTree">
      <div class="ith"><span>Files</span><span class="grow"></span><button class="chip" id="ideNew" title="Make a new file">+ New</button><button class="chip" id="ideChanges">Changes</button><button class="chip" id="ideRewind">Rewind</button></div>
      <div class="itl" id="ideFiles"></div>
    </div>
    <div class="ide-ed" id="ideEd">
      <div class="itabs" id="ideTabs" role="tablist"></div>
      <div class="iai" id="ideAi" hidden>
        <div class="airow"><input id="ideAiIn" type="text" maxlength="500" placeholder="What should change in the selected code? (empty selection: what to write here)" aria-label="What to change"><button class="chip go" id="ideAiGo">Go</button><button class="chip" id="ideAiX" aria-label="Close">&#10005;</button></div>
        <div class="aistat" id="ideAiStat"></div>
        <div class="aires" id="ideAiRes"></div>
      </div>
      <div class="iconf" id="ideConf" hidden></div>
      <div class="ibody" id="ideBody"></div>
      <div class="iout" id="ideOut" hidden>
        <div class="oh"><b>Output</b><span class="grow"></span><button class="chip" id="outRunFile" title="Run the open file">Run file</button><button class="chip" id="outRunTests" title="Run the project's tests">Run tests</button><button class="chip" id="outClear">Clear</button><button class="chip" id="outX" aria-label="Close output">&#10005;</button></div>
        <div class="ol" id="ideOutLog"></div>
        <form class="oc" id="outForm"><span>$</span><input id="outCmd" type="text" maxlength="500" placeholder="python -m unittest   (the same programs VryxCode may run)" aria-label="Command to run" autocomplete="off" spellcheck="false"><button class="chip" id="outGo" type="submit">Run</button></form>
      </div>
      <div class="ibar" id="ideBar"><span id="ideStatus"></span><span class="grow"></span><span id="ideLang" class="lang"></span><span id="acStat" class="lang"></span><button class="chip" id="ideAc" title="Grey suggestions as you type (Tab accepts, Esc dismisses). Uses the model picked for VryxCode and counts like a small coding step; a smaller model is faster.">Autocomplete: Off</button><button class="chip" id="ideOutBtn" title="Output: test and command results">Output</button><button class="chip" id="ideExplain" title="Explain the selected code in plain words">Explain</button><button class="chip" id="ideEditSel" title="Select code, then describe the change (Ctrl+K). You see it before anything changes.">Edit selection</button><button class="chip" id="ideSave">Save</button></div>
    </div>
    <div class="col">
      <div class="todo" id="codeTodo" hidden></div>
      <div class="feed" id="codeFeed" aria-live="polite"><div class="feedin" id="codeIn"></div></div>
      <div class="composer">
        <div class="box">
          <div class="menu" id="codeModelMenu" hidden style="top:auto;bottom:100%;left:0;right:auto;margin:0 0 10px"></div>
          <div class="menu" id="codeEnvMenu" hidden style="top:auto;bottom:100%;left:0;right:auto;margin:0 0 10px"></div>
          <div class="menu" id="codeModeMenu" hidden style="top:auto;bottom:100%;left:0;right:auto;margin:0 0 10px"></div>
          <div class="menu" id="codeCtxMenu" hidden style="top:auto;bottom:100%;left:auto;right:0;margin:0 0 10px;width:min(340px,100%)"></div>
          <div class="menu suggest" id="codeSuggest" hidden style="top:auto;bottom:100%;left:0;right:auto;margin:0 0 10px;width:min(440px,100%)"></div>
          <div class="card">
            <label class="sr" for="codeTask">Task</label>
            <textarea id="codeTask" rows="2" maxlength="8000" placeholder="Ask, answer, or tell VryxCode what to build or fix"></textarea>
            <div class="tools">
              <div class="left"><button class="pill" id="codeModelBtn" aria-haspopup="true" aria-label="Choose model"></button><button class="pill plain" id="codeEnv" aria-haspopup="true" aria-label="Where it runs"></button><button class="pill plain" id="codeAuto" aria-pressed="false">Auto-approve: off</button></div>
              <button class="ctx" id="codeCtx" hidden aria-haspopup="true" aria-label="Memory used"></button>
              <button class="send" id="codeGo" aria-label="Run">&uarr;</button>
              <button class="send stop" id="codeStop" aria-label="Stop" hidden>&#9632;</button>
            </div>
          </div>
          <div class="tip" id="codeUsage"></div>
        </div>
      </div>
    </div>
    <div class="pv" id="codePv" hidden>
      <div class="pvbar">
        <button class="icon" id="pvBack" aria-label="Close preview"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="title">Preview</span>
        <button class="chip" data-size="phone">Phone</button><button class="chip" data-size="tablet">Tablet</button><button class="chip" data-size="desktop">Wide</button>
        <button class="chip" id="pvReload" aria-label="Reload the preview">&#8635;</button>
      </div>
      <div class="pvstage" id="pvStage" data-size="phone"><iframe id="pvFrame" title="Preview of your project" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-pointer-lock" referrerpolicy="no-referrer"></iframe></div>
      <div class="pvfoot" id="pvFoot"></div>
    </div>
    <div class="drawer" id="codeDrawer" hidden>
      <div class="dh"><div class="dtabs" role="tablist"><button data-tab="files" class="on">Files</button><button data-tab="changes">Changes</button><button data-tab="rewind">Rewind</button></div><button class="icon" id="codeDrawerX" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <div class="dpane" id="tabFiles"><div class="fsearch"><input id="codeSearch" type="search" placeholder="Search the project..." aria-label="Search the project" autocomplete="off"><button class="chip" id="codeMapBtn" title="What is where in this project">Map</button></div><div class="flist" id="codeFiles"></div><div class="viewer"><pre id="codeView">Pick a file to read it.</pre></div></div>
      <div class="dpane" id="tabChanges" hidden></div>
      <div class="dpane" id="tabRewind" hidden></div>
    </div>
  </div>
  <input type="file" id="codeZipIn" accept=".zip,application/zip" hidden><input type="file" id="codeDirIn" webkitdirectory multiple hidden>
</div>

<div class="auth" id="auth" hidden></div>
<div id="dialogs"></div>

<script src="/editor.js"></script>
<script src="/js/core.js"></script>
<script src="/js/tour.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/documents.js"></script>
<script src="/js/qr.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/send.js"></script>
<script src="/js/code.js"></script>
<script src="/js/ide.js"></script>
<script src="/js/preview.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/boot.js"></script>
</body>
</html>
