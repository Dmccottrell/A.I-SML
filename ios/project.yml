# The iPhone app. Xcode's project file is made from this one: run `xcodegen generate` in ios/ after changing it.
name: Emvryx
options:
  bundleIdPrefix: app.emvryx
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  # The Mac has Xcode 15.4, which cannot open Xcode 16's project format.
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Emvryx:
    type: application
    platform: iOS
    sources: [Emvryx, Shared]
    dependencies:
      - target: EmvryxShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.emvryx.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Emvryx/Info.plist
      properties:
        CFBundleDisplayName: Emvryx
        # emvryx://ask?text=... (used by the share extension): the words go in the message box of a new chat.
        CFBundleURLTypes:
          - CFBundleURLName: app.emvryx.ios
            CFBundleURLSchemes: [emvryx]
        # The Android app's fonts (android/app/src/main/res/font): Sora for headings, DM Sans for text.
        UIAppFonts: [sora.ttf, dm_sans.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Emvryx uses the microphone when you press the voice button.
        NSSpeechRecognitionUsageDescription: Emvryx turns what you say into text when you press the voice button.
        NSCameraUsageDescription: Emvryx uses the camera when you take a photo to send in a chat.
        NSFaceIDUsageDescription: Emvryx uses Face ID to unlock the app when you have switched the app lock on.
        NSPhotoLibraryUsageDescription: Emvryx opens your photos when you choose one to send in a chat.
  EmvryxShare:
    type: app-extension
    platform: iOS
    sources: [EmvryxShare, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.emvryx.ios.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    info:
      path: EmvryxShare/Info.plist
      properties:
        CFBundleDisplayName: Emvryx
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
  EmvryxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EmvryxTests]
    dependencies:
      - target: Emvryx
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  EmvryxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EmvryxUITests]
    dependencies:
      - target: Emvryx
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Emvryx
schemes:
  Emvryx:
    build:
      targets:
        Emvryx: all
        EmvryxTests: [test]
        EmvryxUITests: [test]
    test:
      targets: [EmvryxTests, EmvryxUITests]
