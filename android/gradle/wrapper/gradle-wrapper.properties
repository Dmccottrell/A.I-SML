# The "Gradle wrapper" settings: it lets anyone build the app without installing Gradle first, because
# the wrapper script downloads exactly the Gradle version named below (8.9) the first time it runs.
# Where Gradle keeps downloaded files (under the user's Gradle home folder) and where the wrapper unpacks them.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The download address of the Gradle version to use (the backslash only escapes the colon in this file format).
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
# Give up on a slow download after 10 000 milliseconds (10 seconds).
networkTimeout=10000
# Check the download address looks like a real Gradle one, as a safety measure.
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
