# Settings Gradle reads for every build of the Android project.
# Give the Gradle background process up to 3 GB of memory and make it read/write text as UTF-8 (so emoji and accents survive).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Use the AndroidX libraries (the modern replacement for the old Android support libraries).
android.useAndroidX=true
# Each module's generated R class holds only its own resources, which makes builds smaller and faster.
android.nonTransitiveRClass=true
# Use the official Kotlin code style.
kotlin.code.style=official
