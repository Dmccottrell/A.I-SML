# Python 3.11 with the project's packages, and (when asked) a Chromium for the browser tests. Used by the gate's test shards.
name: python-env
description: Install Python, the project's packages and optionally the browser the browser tests drive
inputs:
  browser:
    description: "true to install Chromium and export EMVRYX_BROWSER (needed only by the browser test files)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install the packages
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt peft playwright pyflakes pyyaml
    - name: Cache the browser
      if: inputs.browser == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v1
    - name: Install the browser
      if: inputs.browser == 'true'
      shell: bash
      run: |
        python -m playwright install chromium
        if ! python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
          python -m playwright install-deps chromium
        fi
        echo "EMVRYX_BROWSER=$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
