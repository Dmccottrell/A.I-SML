# supreme-ci-gate: every pull request to main goes through this one gate. It is built to be read from the top down, in the order things run:
#
#   security-scan  -->  guard  -->  tests (shard 1, shard 2)  +  build-android (only when android/ changed)  -->  gate-result
#   changes (decides which optional jobs are needed, runs beside security-scan)
#   report-only (never block a merge; they make reports): windows-tests, screens, windows-app, sandbox, workers-cloudflare, commit-signatures
#
# Rules this file keeps (tests/test_workflows.py checks them on every pull request):
#   * every action is pinned to a full commit id (a tag can be moved by whoever owns the action; a commit id cannot), with the version in a comment;
#   * the default permission is read-only and each job asks for only what it needs;
#   * no secret is used here at all (a pull request can change this very file, so it must never hold anything worth stealing); alerts are sent by
#     alert-router.yml, which runs from main and only reads the result of this run;
#   * nothing from outside (a branch name, a pull request title) is put into a command: it is passed through `env` and used as data.
#
# It runs next to the older workflows (tests, android, windows-app, sandbox) until the owner switches over: docs/DEVSECOPS.md, "Switching over".
name: supreme-ci-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per pull request at a time: a newer push cancels the older, still-running run.
concurrency:
  group: supreme-ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing is allowed unless a job asks for it.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------------------------------------------- 1. which optional jobs are needed
  changes:
    name: "gate: changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      windows: ${{ steps.filter.outputs.windows }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/supreme-ci-gate.yml'
              - '.github/actions/android-ndk/**'
            windows:
              - 'windows-app/**'
              - '.github/workflows/supreme-ci-gate.yml'
              - '.github/actions/build-windows/**'
            sandbox:
              - 'docker/**'
              - 'coding/code_sandbox.py'
              - 'coding/code_servers.py'
              - 'tools/sandbox_smoke.py'
              - '.github/workflows/supreme-ci-gate.yml'

  # ---------------------------------------------------------------------------------------------------------------- 2. no secret may enter main
  security-scan:
    name: "gate: security-scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                                   # TruffleHog reads every commit of the pull request, not only the last one
          persist-credentials: false
      # TruffleHog (open source) looks through the commits for keys and tokens and asks each service whether the one it found is live. `--results=verified`
      # means only a key that still works fails the run (no noise from test fixtures). The action itself adds `--fail` (the run fails when there is one) and
      # `--no-update`; passing them again makes TruffleHog refuse to start ("flag 'fail' cannot be repeated"), which is what the first run on GitHub showed.
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified

  # ---------------------------------------------------------------------------------------------------------------- 3. the repository's own rules
  guard:
    name: "gate: guard"
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Guardrails (tests are the judge, no skipping, a fix has its proof, no secrets)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "$BASE_REF"
          git checkout -q -B guard-head "$HEAD_SHA"
          python tools/guard_repo.py --base "origin/$BASE_REF" --title "$PR_TITLE"

  # ---------------------------------------------------------------------------------------------------------------- 4. the tests, in two parallel shards
  # Shard 1: every linter (Python, JavaScript, JSON, YAML, XML, CSS, shell, HTML, the workflows themselves, C++) + half of the tests that need no browser.
  # Shard 2: the other half of those + every browser test suite (they drive a real Chromium, which only this shard installs).
  tests:
    name: "gate: tests (shard ${{ matrix.shard }}/2)"
    needs: [security-scan, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
        with:
          browser: ${{ matrix.shard == 2 && 'true' || 'false' }}
      # ---- shard 1: the linters
      - name: Lint Python (unused imports, undefined names)
        if: matrix.shard == 1
        run: python tools/lint.py
      - name: Lint JavaScript, JSON, YAML, XML, CSS, shell and HTML
        if: matrix.shard == 1
        run: python tools/lint_polyglot.py
      # actionlint, shellcheck and cppcheck have not been run against this code before, so their findings are shown but do not stop the gate yet
      # (continue-on-error). Remove that line from each one after a run has come back clean: from then on a finding blocks the merge.
      - name: Lint the workflows (actionlint)
        if: matrix.shard == 1
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint shell scripts (shellcheck, errors only)
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then shellcheck --severity=error "${scripts[@]}"; fi
      - name: Lint C++ (cppcheck)
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends cppcheck > /dev/null
          cppcheck --error-exitcode=1 --enable=warning,performance --inline-suppr --suppress=missingIncludeSystem --quiet windows-app/main.cc
      # ---- both shards: the tests
      - name: Tests, no-browser files (half ${{ matrix.shard }} of 2)
        timeout-minutes: 20
        run: python scripts/run_tests.py --kind plain --shard ${{ matrix.shard }}/2
      - name: Tests, every browser suite
        if: matrix.shard == 2
        timeout-minutes: 20
        run: python scripts/run_tests.py --kind browser

  # ---------------------------------------------------------------------------------------------------------------- 5. Android compile (only when android/ changed)
  build-android:
    name: "gate: build-android"
    needs: [changes, guard]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: ./.github/actions/android-ndk
      - name: Unit tests and the debug app
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emvryx-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------------------------- 6. report-only jobs (continue-on-error: they never block a merge)
  windows-tests:
    name: "gate: windows-tests (report only)"
    needs: [security-scan, guard]
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the packages
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt peft playwright pyflakes pyyaml
      - name: Install the browser
        timeout-minutes: 10
        run: python -m playwright install chromium
      - name: Find the browser the browser tests use
        shell: bash
        run: echo "EMVRYX_BROWSER=$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Tests
        timeout-minutes: 35
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_tests.py -j 2

  screens:
    name: "gate: screens (report only)"
    needs: [changes, build-android]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: write                                      # only to keep the pictures under refs/screens/latest (not a branch) for a cloud session to fetch
    steps:
      - name: Free disk space (the emulator's phone storage needs several GB)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Demo server (a stand-in Emvryx the app signs in to; its test key is masked in every log)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python app_server.py --data .shots --add-user shots mega > user.txt
          python app_server.py --data .shots --make-admin shots --plan mega --unlimited > /dev/null || true
          KEY=$(sed -n 's/.*Key (shown once, not stored): //p' user.txt)
          rm user.txt
          echo "::add-mask::$KEY"
          echo "SHOTS_KEY=$KEY" >> "$GITHUB_ENV"
          nohup python app_server.py --data .shots --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 2; done
      - name: Enable KVM (the emulator runs many times faster)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The emulator, its phone image and the NDK (tried again when Google's download arrives broken)
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "system-images;android-34;google_apis;x86_64" "ndk;27.0.12077973" > /dev/null 2>&1 && \
              [ -x "$ANDROID_HOME/emulator/emulator" ] && [ -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties" ] && break
            echo "The download failed (try $i of 3): trying again"; sleep 15
          done
      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disk-size: 2048M
          cores: 4
          working-directory: android
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.key=$SHOTS_KEY
            adb pull /data/local/tmp/emvryx-screens ../screens || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emvryx-android-screens
          path: |
            screens/
            server.log
          if-no-files-found: ignore
      # Only for a pull request from this repository (a fork's token cannot write, and a fork must not be able to write pictures here anyway).
      - name: Keep the pictures where a cloud session can fetch them (git fetch origin refs/screens/latest)
        if: always() && hashFiles('screens/*.png') != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd screens
          git init -q && git checkout -q -b screens
          git -c user.name=emvryx-ci -c user.email=ci@emvryx.invalid add *.png
          git -c user.name=emvryx-ci -c user.email=ci@emvryx.invalid commit -qm "Android screenshots for $SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -qf "https://github.com/$REPO.git" HEAD:refs/screens/latest

  windows-app:
    name: "gate: windows-app (report only)"
    needs: [changes, guard]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-windows
        with:
          identity-name: ${{ vars.MSIX_IDENTITY_NAME }}
          publisher: ${{ vars.MSIX_PUBLISHER }}
          publisher-display: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emvryx-windows
          path: |
            dist/Emvryx-Setup.exe
            dist/Emvryx.msix

  sandbox:
    name: "gate: sandbox (report only)"
    needs: [changes, guard]
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build the sandbox image
        timeout-minutes: 40
        run: docker build -t emvryx/code-sandbox:1 docker/code-sandbox
      - name: Every language builds and runs, sealed
        timeout-minutes: 15
        run: python tools/sandbox_smoke.py

  # Cloudflare's own "Workers Builds" check on this repository always fails and is ignored. This job stands in for it: it exits 1 on purpose, so the run shows
  # what that check looks like without anything depending on Cloudflare, and because of continue-on-error it can never block a merge.
  workers-cloudflare:
    name: "gate: workers-cloudflare (known failing, report only)"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions: {}
    steps:
      - name: Fail on purpose
        run: |
          echo "Workers Builds (Cloudflare) fails on this repository by design; it is not part of the gate."
          exit 1

  # Every commit of the pull request should carry a signature GitHub can check (an SSH or GPG key registered on the author's account). Until the owner sets the
  # repository variable SIGNED_COMMITS_ENFORCE to true, this only reports. docs/DEVSECOPS.md, section 2.
  commit-signatures:
    name: "gate: commit-signatures"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ vars.SIGNED_COMMITS_ENFORCE != 'true' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every commit is verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR/commits?per_page=100" > commits.json
          python3 - <<'PY'
          import json, sys
          commits = json.load(open("commits.json"))
          bad = [(c["sha"][:10], c["commit"]["verification"]["reason"]) for c in commits if not c["commit"]["verification"]["verified"]]
          print(f"{len(commits)} commit(s), {len(bad)} not verified")
          for sha, why in bad:
              print(f"::warning::commit {sha} is not verified ({why})")
          sys.exit(1 if bad else 0)
          PY

  # ---------------------------------------------------------------------------------------------------------------- 7. one answer for the branch rule
  # Make THIS the one required check of main (docs/DEVSECOPS.md): it passes only when everything that had to run has passed. A job that was skipped because its
  # folder did not change counts as passed; a failed or cancelled one does not.
  gate-result:
    name: "gate: result"
    if: always()
    needs: [changes, security-scan, guard, tests, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Everything that had to pass passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in needs.items():
              print(f"{k}: {v['result']}")
          if bad:
              print(f"::error::the gate is closed: {bad}")
              sys.exit(1)
          print("the gate is open")
          PY
