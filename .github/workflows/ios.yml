# Builds the iPhone app (ios/) on every pull request that touches it and runs its tests in the iPhone simulator, on one of GitHub's Mac computers
# (free for a public project). It is the same thing you run on your Mac: cd ios && xcodegen generate && xcodebuild test ...
# What it checks: the app still compiles, and the tests that need no server pass (the links, the Siri Shortcut, the stream reader, VryxCode's logic against a
# scripted server, the off screen). The tests that drive a signed-in chat need an Emvryx server and skip themselves here (docs: ios/README.md).
# How to read this file: it is a GitHub Actions workflow. GitHub reads it and runs the listed jobs on its own computers ("runners") whenever a trigger
# below happens. YAML is a plain-text format: indentation shows what belongs to what, "- " starts a list item, and "key: value" sets a value.
# The label shown for this workflow in the Actions tab on GitHub.
name: ios

# "on" lists the events that start this workflow.
# (The "paths" lists below mean: only start when a changed file matches one of them, so a Python-only change does not wait for a Mac build.)
on:
  # When someone pushes to main (for example after a pull request is merged).
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  # When a pull request is opened or updated.
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  # Lets a person start this workflow by hand from the Actions tab (no extra settings needed).
  workflow_dispatch:

# Only one run per pull request (or per branch) at a time. If a newer run starts, the older one is cancelled, which saves build minutes.
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A job is a group of steps that runs on one fresh machine. This file has two: build, and engine (the phone model's engine).
jobs:
  # Compile the app and run its tests in the iPhone simulator.
  build:
    # A GitHub Mac with Apple silicon. macOS 14 comes with Xcode 15.4 and the iPhone 15 simulator, the same as the owner's Mac.
    runs-on: macos-14
    # Stop the job if it takes longer than 45 minutes, so a hung step cannot run for hours.
    timeout-minutes: 45
    # Settings that apply to every "run:" step of this job.
    defaults:
      run:
        # Run every shell command inside the ios/ folder (where project.yml lives).
        working-directory: ios
    steps:
      # Download this repository's code onto the machine.
      - uses: actions/checkout@v4
      # Use Xcode 15.4 (the project file is written for it: see "projectFormat" in ios/project.yml).
      - name: Use Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      # XcodeGen makes Emvryx.xcodeproj from project.yml; the project file itself is not kept in git.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      # Build and test in the simulator. CODE_SIGN_IDENTITY=- signs it for the simulator only (a real iPhone needs your Apple ID, on your Mac).
      # The tests that need a server skip themselves, and the result is kept so a failing screen can be looked at.
      - name: Build and test
        run: |
          xcodebuild test \
            -project Emvryx.xcodeproj -scheme Emvryx \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            CODE_SIGN_IDENTITY=-
      # Keep the test results (screenshots and logs) for a week, even when a test failed (always()).
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          retention-days: 7

  # The phone model's engine, llama.cpp: build it for the iPhone simulator and the iPhone (about 10 minutes the first time, then kept), put it in the
  # app, and compile and test everything with it. The real-inference tests need a model file and skip here (ios/README.md: how to run them on your Mac).
  engine:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install XcodeGen and cmake
        run: brew install xcodegen cmake
      # The built library is kept between runs; the key changes when the script (which names the llama.cpp version) changes.
      - name: Keep the built engine
        id: engine
        uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: llama-${{ runner.os }}-${{ hashFiles('ios/scripts/get-llama.sh') }}
      - name: Build llama.cpp
        if: steps.engine.outputs.cache-hit != 'true'
        run: ./scripts/get-llama.sh
      - name: Make the Xcode project (with the engine)
        run: ./scripts/generate.sh
      - name: Build and test with the engine
        run: |
          xcodebuild test \
            -project Emvryx.xcodeproj -scheme Emvryx \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build CODE_SIGN_IDENTITY=-
      # The same app for a real iPhone must compile and link too (no signing here: that needs your Apple ID, on your Mac).
      - name: Build for an iPhone
        run: |
          xcodebuild build \
            -project Emvryx.xcodeproj -scheme Emvryx \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO
