# Runs the whole test suite (and a lint check) on every pull request and on main, so a broken change cannot be merged unnoticed.
# Locally the same thing is: python scripts/run_tests.py   and   python tools/lint.py
name: tests

# Once per change: on a pull request (every push to it), and on main after a merge. A push to a working branch alone does not run it,
# so the same commit is no longer tested two or three times over (push + pull request + main).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]                     # the suite in two halves, side by side: about half the wait
    name: tests (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt peft playwright pyflakes
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v1
      - name: Install the browser
        timeout-minutes: 10                # a download that hangs fails here instead of holding the run for half an hour
        # The browser itself comes from Playwright's own download (cached above). The system packages it needs are usually already on the runner;
        # they are installed from Ubuntu's mirror (slow some days: it stalled two runs on fonts alone) only when the browser cannot start without them.
        run: |
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            python -m playwright install-deps chromium
          fi
      - name: Find the browser the browser tests use
        run: |
          echo "EMVRYX_BROWSER=$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Lint (unused imports, undefined names)
        if: matrix.shard == 1
        run: python tools/lint.py
      - name: Tests
        timeout-minutes: 15
        run: python scripts/run_tests.py --shard ${{ matrix.shard }}/2

  # The project's guardrails (tools/guard_repo.py): existing tests are not deleted or weakened, no new unconditional skips, a fix comes with a
  # test, no secrets. Pull requests only (it compares the change with main).
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guardrails
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          git checkout -q -B guard-head "${{ github.event.pull_request.head.sha }}"
          python tools/guard_repo.py --base "origin/${{ github.base_ref }}"

  # The same tests on Windows, like the Emvryx computer: catches what only Windows does (paths with \, no fork, other shells).
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt peft playwright pyflakes
      - name: Install the browser
        timeout-minutes: 10
        run: python -m playwright install chromium
      - name: Find the browser the browser tests use
        shell: bash
        run: |
          echo "EMVRYX_BROWSER=$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Tests
        timeout-minutes: 30
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_tests.py
