# Runs the whole test suite (and a lint check) on every pull request and on main, so a broken change cannot be merged unnoticed.
# Locally the same thing is: python scripts/run_tests.py   and   python tools/lint.py
# How to read this file: a GitHub Actions workflow (GitHub runs the jobs below on its own computers when a trigger happens). YAML uses indentation
# to show what belongs to what, "- " starts a list item, and "key: value" sets a value. This file has three jobs: tests, guard and windows.
# The label shown for this workflow in the Actions tab.
name: tests

# Once per change: on a pull request (every push to it), and on main after a merge. A push to a working branch alone does not run it,
# so the same commit is no longer tested two or three times over (push + pull request + main).
# The events that start this workflow (explained in the comment above).
on:
  # After a merge into main.
  push:
    branches: [main]
  # Every time a pull request is opened or gets a new commit.
  pull_request:
  # Also lets a person start it by hand from the Actions tab.
  workflow_dispatch:

# One run per pull request (or per branch) at a time: a newer push cancels the older, still-running run, which saves build minutes.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A job is a group of steps run on one fresh machine.
jobs:
  # Job 1, tests: run the lint check and the whole test suite on Linux.
  tests:
    # A Linux machine from GitHub.
    runs-on: ubuntu-latest
    # Give up on the whole job after 30 minutes so a hang cannot run forever.
    timeout-minutes: 30
    # A matrix runs this job once per listed value, all at the same time. fail-fast: false means that if one shard fails the other still finishes,
    # so you see every failure in one go instead of only the first.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]                     # the suite in two halves, side by side: about half the wait
    # The display name of each copy, for example "tests (1/2)".
    name: tests (${{ matrix.shard }}/2)
    # Steps run one after another; if one fails, the later ones are skipped.
    steps:
      # Download this repository's code onto the machine.
      - uses: actions/checkout@v4
      # Install Python 3.11. "cache: pip" keeps downloaded packages between runs; the cache is refreshed whenever requirements.txt changes.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Install the Python packages. torch (the AI library) comes from PyTorch's CPU-only download, which is far smaller than the default GPU build.
      # peft (LoRA fine-tuning), playwright (drives a real browser for the browser tests) and pyflakes (used by the lint check) are only needed for tests.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt peft playwright pyflakes
      # Keep the downloaded test browser between runs; the key changes when requirements.txt does, which forces a fresh download.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v1
      # Download Chromium (the browser the browser tests use), and the system libraries it needs if the first try cannot start it. The 10-minute limit below is for this step only.
      - name: Install the browser
        timeout-minutes: 10                # a download that hangs fails here instead of holding the run for half an hour
        # The browser itself comes from Playwright's own download (cached above). The system packages it needs are usually already on the runner;
        # they are installed from Ubuntu's mirror (slow some days: it stalled two runs on fonts alone) only when the browser cannot start without them.
        run: |
          # Download the browser itself.
          python -m playwright install chromium
          # Check that the browser can really start (the python one-liner starts Playwright, launches Chromium, closes it). "if !" means: if that fails,
          # install the missing system libraries too.
          if ! python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            python -m playwright install-deps chromium
          fi
      # Ask Playwright where it put Chromium and save that path in the environment variable EMVRYX_BROWSER for the following steps. Appending to the
      # file named by $GITHUB_ENV is how one step passes a variable on to later steps.
      - name: Find the browser the browser tests use
        run: |
          echo "EMVRYX_BROWSER=$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      # Lint = an automatic check for simple code mistakes. Run only on shard 1 so it is not done twice.
      - name: Lint (unused imports, undefined names)
        if: matrix.shard == 1
        run: python tools/lint.py
      # Run this machine's half of the tests. "--shard 1/2" or "2/2" picks the half; scripts/run_tests.py deals the test files out so both halves take about as long.
      - name: Tests
        timeout-minutes: 15
        run: python scripts/run_tests.py --shard ${{ matrix.shard }}/2

  # Job 2, guard: checks the project's rules on the change itself (tests not deleted or weakened, a fix comes with a test, no secrets).
  # The project's guardrails (tools/guard_repo.py): existing tests are not deleted or weakened, no new unconditional skips, a fix comes with a
  # test, no secrets. Pull requests only (it compares the change with main).
  guard:
    # Only for pull requests, because it compares the change with main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A short limit: this job is quick.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Download the full git history, not just the latest commit, so the change can be compared with main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PR_TITLE is passed through "env" (not pasted into the command) so a strange pull request title cannot be run as a command.
      # The commands: fetch the base branch (usually main), switch to the pull request's own commit, then run the checker against the base branch.
      - name: Guardrails
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          git checkout -q -B guard-head "${{ github.event.pull_request.head.sha }}"
          python tools/guard_repo.py --base "origin/${{ github.base_ref }}"

  # Job 3, windows: the same tests on Windows, because the owner's PC runs Windows.
  # The same tests on Windows, like the Emvryx computer: catches what only Windows does (paths with \, no fork, other shells).
  # The whole suite on Windows (the owner's PC runs Windows). Report-only for now: the suite was written on Linux and still has Windows-only
  # differences (open files cannot be deleted, file modes, paths). The failing tests are listed at the end of the log; make it blocking again
  # (remove continue-on-error) once it is green.
  windows:
    # A Windows machine from GitHub.
    runs-on: windows-latest
    # Windows is slower, so this job gets more time.
    timeout-minutes: 45
    # A failure here is shown but does not fail the pull request (see the note above: this job is report-only for now).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # Same installs as the Linux job.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt peft playwright pyflakes
      # Download Chromium for the browser tests (no extra system libraries are needed on Windows).
      - name: Install the browser
        timeout-minutes: 10
        run: python -m playwright install chromium
      # Same as the Linux job: save the browser's path for the tests. "shell: bash" is used because the line is written for bash.
      - name: Find the browser the browser tests use
        shell: bash
        run: |
          echo "EMVRYX_BROWSER=$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      # PYTHONIOENCODING=utf-8 stops Python crashing on non-English text when printing in Windows' console. The test runner is started with 2 files at a
      # time (-j 2); the reason is in the comment right below.
      - name: Tests
        timeout-minutes: 30
        env:
          PYTHONIOENCODING: utf-8
        # two files at a time, not four: with four, the browser tests on this 4-core machine timed out waiting for pages (a different one each run)
        run: python scripts/run_tests.py -j 2
