# monitor-uptime: every five minutes, ask the two public addresses whether they are up. If either is down after three tries, a P1 alert goes to the phone
# (ntfy, highest priority) - at most twice an hour, so a long outage is not a flood. Only public addresses are asked, and nothing is sent to them but a normal request.
#   https://chat.emvryx.app/api/status   the chat server on the owner's PC (answers {"up": true, ...})
#   https://emvryx.app/                  the website (Vercel)
# GitHub runs scheduled workflows on a best-effort basis (a run can be a few minutes late) and switches them off after 60 days without any change to the repository.
name: monitor-uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-uptime
  cancel-in-progress: true

permissions: {}

jobs:
  probe:
    name: "monitor: production is up"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Ask both addresses (three tries each, twenty seconds apart)
        id: probe
        run: |
          down=""
          for try in 1 2 3; do
            chat_ok=false; site_ok=false
            if curl -fsS --max-time 15 https://chat.emvryx.app/api/status | jq -e '.up == true' > /dev/null 2>&1; then chat_ok=true; fi
            code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://emvryx.app/ || true)"
            if [ "$code" = "200" ]; then site_ok=true; fi
            if [ "$chat_ok" = true ] && [ "$site_ok" = true ]; then down=""; break; fi
            down=""
            if [ "$chat_ok" = false ]; then down="the chat server (chat.emvryx.app)"; fi
            if [ "$site_ok" = false ]; then down="${down:+$down and }the website (emvryx.app, answered ${code:-nothing})"; fi
            if [ "$try" -lt 3 ]; then sleep 20; fi
          done
          minute="$(date -u +%M)"
          window=false
          if [ "$((10#$minute))" -lt 5 ] || { [ "$((10#$minute))" -ge 30 ] && [ "$((10#$minute))" -lt 35 ]; }; then window=true; fi
          echo "down=$down" >> "$GITHUB_OUTPUT"
          echo "window=$window" >> "$GITHUB_OUTPUT"
          if [ -n "$down" ]; then echo "DOWN: $down"; else echo "both are up"; fi
      - name: P1 alert, production is down
        if: steps.probe.outputs.down != '' && steps.probe.outputs.window == 'true'
        uses: ./.github/actions/notify
        env:
          NTFY_TOPIC_P1: ${{ secrets.NTFY_TOPIC_P1 }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        with:
          priority: p1
          title: Emvryx is down
          message: ${{ steps.probe.outputs.down }} did not answer three times in a row.
          url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      # A down site must show as a red run too, so the Actions tab and the repository's e-mail from GitHub say so even when no alert channel is set up.
      - name: Fail the run when something is down
        if: steps.probe.outputs.down != ''
        env:
          DOWN: ${{ steps.probe.outputs.down }}
        run: |
          echo "::error::Down: $DOWN"
          exit 1
